<!DOCTYPE html>
<html lang="en" style="--ms: 1.6; --fh: 60px; --flash: 1s; --fs: 16px; --ff: &quot;Source Sans 3&quot;,&quot;Source Sans Pro&quot;,Helvetica,Arial,sans-serif;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KE Wall Smasher (Phone)</title>
<meta name="classlive-states" content="wall">
<style>
  :root { --fh:48px; --ms:2; --fs:20px; --ff:'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; background:#12291F; font-family:var(--ff); }
  canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  /* no boxes: the controls are plain text on the scene; one size and one weight for all text (set by --fs) */
  #panel { position:absolute; left:20px; top:20px; box-sizing:border-box; padding:0;
    color:#EDE9E0; display:flex; flex-direction:column; gap:calc(var(--fs)*0.5); user-select:none; -webkit-user-select:none; }
  .row { display:flex; align-items:center; flex-wrap:wrap; gap:calc(var(--fs)*0.3) calc(var(--fs)*0.9); }
  button { padding:calc(var(--fs)*0.15) 0; cursor:pointer; box-sizing:border-box; background:none; border:none; border-radius:0;
    font:500 var(--fs)/1.3 var(--ff); color:#fff; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  /* the menu text is picture text (ke wall menu.png), scaled by --ms; the chosen item gets a white line under it */
  .grp { display:flex; flex-direction:column; margin-bottom:calc(var(--ms)*10px); }
  .hd { margin-bottom:calc(var(--ms)*4px); }
  .grp .row { gap:0; flex-wrap:nowrap; align-items:flex-start; }
  .mt { display:block; font:400 calc(var(--ms)*12px)/1 var(--ff); word-spacing:calc(var(--ms)*-6px); white-space:pre; color:#fff; }
  #panel.live .hd { margin-bottom:calc(var(--ms)*6px); }
  #panel.live .grp { margin-bottom:calc(var(--ms)*12px); }
  /* bigger touch targets for fingers: an invisible area around every picture button */
  button.m::after, button.s::after, #btnFire::after, #btnReset::after { content:''; position:absolute; left:-10px; right:-10px; top:-12px; bottom:-12px; }
  .hd img, button img { display:block; image-rendering:pixelated; }
  button.m, button.s { position:relative; padding:0 0 calc(var(--ms)*2px) 0; border-bottom:calc(var(--ms)*1.5px) solid transparent; }
  button.m.sel, button.s.sel { border-bottom-color:#fff; }
  button:disabled { cursor:not-allowed; opacity:.55; }
  /* ---- phone version: the Mass / Speed menu is a popup opened from a button at the top left ---- */
  #menuBtn, #scrim, #menuX { display:none; }
  body.phone #menuBtn { display:flex; position:absolute; left:12px; top:12px; z-index:10; align-items:center; gap:calc(var(--ms)*12px); padding:calc(var(--ms)*6px) calc(var(--ms)*8px); border:3px solid #fff; background:#12291F; }
  body.phone #menuBtn::after { content:''; position:absolute; left:-8px; right:-8px; top:-8px; bottom:-8px; }
  body.phone #menuBtn svg, #menuX svg { display:block; shape-rendering:crispEdges; }
  body.phone #menuBtn img { display:block; image-rendering:pixelated; }
  body.phone #menuBtn.hide { display:none; }
  body.phone.menuopen #scrim { display:block; position:fixed; left:0; top:0; right:0; bottom:0; z-index:15; background:rgba(0,0,0,.55); }
  body.phone #panel { left:12px; top:12px; z-index:20; background:#12291F; border:3px solid #fff; padding:calc(var(--ms)*12px) calc(var(--ms)*40px) 0 calc(var(--ms)*14px); }
  body.phone.menuopen #menuX { display:block; position:absolute; right:calc(var(--ms)*8px); top:calc(var(--ms)*8px); padding:0; }
  body.phone.menuopen #menuX::after { content:''; position:absolute; left:-12px; right:-12px; top:-12px; bottom:-12px; }
  #btnFire:disabled { opacity:1; }
  button.m:disabled.sel, button.s:disabled.sel { opacity:.9; }
  #btnReset { position:absolute; visibility:hidden; display:none; transform:translate(-50%,-50%); clip-path:inset(0 100% 0 0); padding:0 0 calc(var(--ms)*2px) 0; border-bottom:calc(var(--ms)*1.5px) solid transparent; z-index:2; }
  #btnReset.show { visibility:visible; clip-path:inset(0 0 0 0); transition:clip-path .45s steps(12,end); animation:rbflash var(--flash,.75s) steps(1,end) infinite; }   /* one full flash cycle; set with Flash faster/slower in the editor */
  @keyframes rbflash { 0% { opacity:1; } 50% { opacity:0; } 100% { opacity:1; } }
  #btnReset:hover:not(:disabled) { border-bottom-color:#fff; }
  #btnReset img { display:block; image-rendering:pixelated; }
  /* the Fire button is a picture (a question-block style plate) that animates; it is drawn on a canvas that may bump up above the button */
  #btnFire { position:absolute; display:none; z-index:2; width:calc(var(--fh)*220/96); height:var(--fh); padding:0; margin:0; font-size:0; text-shadow:none; }
  #btnFire:hover:not(:disabled) { text-decoration:none; }
  #btnFire canvas { position:absolute; left:0; top:calc(var(--fh)*-0.5); width:100%; height:calc(var(--fh)*160/96); pointer-events:none; image-rendering:pixelated; }
  #editbar { position:absolute; left:480px; max-width:calc(100vw - 40px); top:20px; width:330px; box-sizing:border-box; padding:12px 14px; border-radius:10px; background:#FFF3C4; color:#12291F;
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; box-shadow:0 4px 14px rgba(0,0,0,.45); font:600 17px 'Source Sans 3',Helvetica,Arial,sans-serif; z-index:5; }
  #editbar > div { grid-column:1 / -1; }
  #editbar .note { font:500 14px 'Source Sans 3',Helvetica,Arial,sans-serif; line-height:1.25; }
  #editbar button { height:34px; padding:0 4px; border-radius:6px; font:500 15px 'Source Sans 3',Helvetica,Arial,sans-serif; color:#12291F; text-shadow:none; background:#D2CBBD; border:1px solid #A89E8C; text-decoration:none; }
  #editbar button:hover:not(:disabled) { background:#C7BFB0; color:#12291F; text-decoration:none; }
  #editbar button.primary { color:#fff; font-weight:700; background:#1E5E46; border-color:#12432F; }
</style>
</head>

  }
  function countTimes(){
    var N=ART.numbers, nL=N.smash.ends.length+1;                // letters plus the colon
    var tl=T_START+nL*LET_MS, tc=tl+T_PAUSE, dur=Math.min(1600, 300+count*20);
    return {nL:nL, tl:tl, tc:tc, dur:dur, tr:tc+dur+T_PAUSE};
  }
  function countBox(){      // left edge, top and unit size (px per SVG unit) of the count text
    var u=TS*1.15, N=ART.numbers, wBlock=(N.smash.w+3+3+12+3*12)*u;      // 15% larger than the menu text
    return {x:Math.max(10,(W-wBlock)/2), y:(isNarrow() ? Math.min(cannonBox().y-2*L.tile/dpr, Y(WALL_H))-14-3*N.smash.h*u : Y(IMPACT_Y)-SL_R*L.ppm-N.smash.h*u) - 40, u:u};   // raised 40 px   // phone held upright: above the Fire button and the top of the wall so it clears both;   // middle of the screen; the bottom of the text is flush with the top of the slug's path (the slug's top edge when loaded)
  }
  function drawCount(){
    if(!settleT || !ART.numbers || !NUMIMG.smash) return;
    var t=performance.now()-settleT, T=countTimes(), N=ART.numbers, b=countBox(), u=b.u;
    if(t<T_START) return;
    var nVis=Math.min(T.nL, Math.floor((t-T_START)/LET_MS)+1), nl=N.smash.ends.length;
    cx.imageSmoothingEnabled=false;
    cx.save(); cx.beginPath(); cx.rect(b.x, b.y, (nVis>=nl ? N.smash.w : N.smash.ends[nVis-1]+0.01)*u, N.smash.h*u+1); cx.clip();
    cx.drawImage(NUMIMG.smash, b.x, b.y, N.smash.w*u, N.smash.h*u); cx.restore();
    if(nVis>nl && NUMIMG.colon) cx.drawImage(NUMIMG.colon, b.x+(N.smash.w+3)*u, b.y+1.5*u, N.colon.w*u, N.colon.h*u);
    if(t<T.tc) return;
    var p=Math.min(1,(t-T.tc)/T.dur), val=Math.floor(count*p), x=b.x+(N.smash.w+3+3+12)*u;
    String(val).split('').forEach(function(ch){ var im=NUMIMG['d'+ch]; if(im) cx.drawImage(im, x, b.y+(N.smash.h-N['d'+ch].h)*u, 12*u, N['d'+ch].h*u); x+=12*u; });
  }
  // Fire button (centred over the cannon, one block height above it) and the Rebuild wall button (centred below the count)
  var uiKey='';
  function placeUI(){
    var N=ART.numbers, u=TS, cb=cannonBox(), key;
    var fh=L.tile/dpr, fw=fh*220/96;
    var fl=cb.x+cb.w/2-fw/2, ft=cb.y-fh-fh+15;
    var cb2=countBox(), rh=N?N.rebuild.h*u:0, rw=N?N.rebuild.w*u:0;
    var rl=W/2, rt=cb2.y+20+2*N.smash.h*cb2.u+rh/2;     // centred on the screen, below the count with one cap height of space (and 20 px higher than it was before the count moved up 40)
    key=[fl,ft,rl,rt,u].join();
    if(key!==uiKey){ uiKey=key;
      bFire.style.left=fl+'px'; bFire.style.top=ft+'px';
      if(N){ if(!bReset.firstChild){ var im=new Image(); im.src=N.rebuild.u; im.alt=''; im.draggable=false; bReset.appendChild(im); }
        var im2=bReset.firstChild; im2.style.width=(N.rebuild.w*u)+'px'; im2.style.height=(N.rebuild.h*u)+'px'; }
      bReset.style.left=rl+'px'; bReset.style.top=rt+'px';
    }
    var showR = !!settleT && (performance.now()-settleT) >= countTimes().tr;
    if(showR !== bReset.classList.contains('show')) bReset.classList.toggle('show', showR);
  }

  /* ---------- Edit mode (open this page with #edit on the end of the address) ---------- */
  var AUTO_EDIT=false;                         // true in the art-editor copy, so it opens in edit mode without #edit
  var EDIT=AUTO_EDIT||/[#?&]edit(?![a-z])/i.test(location.hash+location.search);
  var dirty=false, placing=false, editbar=null, noteEl=null;
  function note(t){ if(noteEl) noteEl.textContent = t || (placing ? 'Click the spot on the cannon where the bullet should sit.' : (dirty ? 'Unsaved changes. Press Save HTML.' : 'Pick your art, press Save HTML, then upload the saved file.')); }
  function setArt(key, url){
    var prev=ART[key]; ART[key]=url; dirty=true; note();
    loadArt(key, function(){ ART[key]=prev; note('That file could not be read as an image.'); });
  }
  function pickArt(key){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.addEventListener('change', function(){
      var f=inp.files && inp.files[0]; if(!f) return;
      var fr=new FileReader();
      fr.onload=function(){
        var url=fr.result;
        if(key==='bg' && f.size>1200000){     // keep the saved page small: shrink big backgrounds to 2000 px wide
          var im=new Image();
          im.onload=function(){ var k=Math.min(1,2000/im.naturalWidth), c=document.createElement('canvas');
            c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
            var g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
            setArt('bg', c.toDataURL('image/jpeg',0.88)); };
          im.onerror=function(){ note('That file could not be read as an image.'); };
          im.src=url;
        } else setArt(key,url);
      };
      fr.readAsDataURL(f);
    });
    inp.click();
  }
  function pickFont(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.ttf,.otf,.woff,.woff2,font/*';
    inp.addEventListener('change', function(){
      var f=inp.files && inp.files[0]; if(!f) return;
      var fr=new FileReader();
      fr.onload=function(){ var prev=ART.font; ART.font=fr.result; dirty=true; note('Font loaded.');
        applyFont(function(){ ART.font=prev; applyFont(); note('That file could not be read as a font.'); }); };
      fr.readAsDataURL(f);
    });
    inp.click();
  }
  function serialize(){
    var clone=document.documentElement.cloneNode(true);
    var eb=clone.querySelector('#editbar'); if(eb) eb.parentNode.removeChild(eb);
    clone.querySelector('#art-data').textContent=JSON.stringify(ART);
    var c=clone.querySelector('#cv'); c.removeAttribute('width'); c.removeAttribute('height');
    clone.querySelector('#panel').removeAttribute('style');
    return ('<!DOCTYPE html>\n'+clone.outerHTML).replace('var AUTO_EDIT='+'true;','var AUTO_EDIT='+'false;');   // the saved page is the finished sim, not the editor
  }
  function saveHtml(){
    var blob=new Blob([serialize()],{type:'text/html'});
    function viaDownload(){
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kinetic-energy-wall.html';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
      dirty=false; note('Saved to your Downloads folder as kinetic-energy-wall.html.');
    }
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:'kinetic-energy-wall.html', types:[{description:'HTML file', accept:{'text/html':['.html']}}]})
        .then(function(h){ return h.createWritable().then(function(w){ return w.write(blob).then(function(){ return w.close(); }); }); })
        .then(function(){ dirty=false; note('Saved.'); })
        .catch(function(err){ if(err && err.name==='AbortError') return; viaDownload(); });
    } else viaDownload();
  }
  if(EDIT){
    editbar=document.createElement('div'); editbar.id='editbar';
    editbar.innerHTML='<div>Edit mode</div><button data-k="cannon">Cannon art\u2026</button><button data-k="bullet">Bullet art\u2026</button><button data-k="brick">Brick art\u2026</button><button data-k="bricktop">Top brick art\u2026</button><button data-k="bg">Background\u2026</button>'+
      '<button data-k="nobg">No background</button><button data-k="place">Place bullet</button>'+
      '<button data-k="font">Font file\u2026</button><button data-k="nofont">Default font</button><button data-k="fsm">Text smaller</button><button data-k="fsp">Text bigger</button><button data-k="flf">Flash faster</button><button data-k="fls">Flash slower</button><button data-k="save" class="primary">Save HTML</button><div class="note"></div>';
    document.body.appendChild(editbar); noteEl=editbar.querySelector('.note'); note();
    editbar.addEventListener('click', function(e){
      var k=e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if(!k) return;
      if(k==='cannon'||k==='bullet'||k==='bg'||k==='brick'||k==='bricktop') pickArt(k);
      else if(k==='nobg'){ ART.bg=null; dirty=true; note(); loadArt('bg'); }
      else if(k==='place'){ placing=!placing; note(); }
      else if(k==='font') pickFont();
      else if(k==='nofont'){ ART.font=null; dirty=true; applyFont(); note('Default font.'); }
      else if(k==='fsm'||k==='fsp'){ ART.fs=Math.max(12,Math.min(48,(ART.fs||20)+(k==='fsp'?2:-2))); dirty=true; applyFont(); note('Text size '+ART.fs+' px.'); }
      else if(k==='flf'||k==='fls'){ ART.flash=Math.max(0.2,Math.min(3,Math.round(((ART.flash||0.75)+(k==='fls'?0.1:-0.1))*10)/10)); dirty=true; applyFlash(); note('Rebuild Wall flash: one cycle every '+ART.flash+' s.'); }
      else if(k==='save') saveHtml();
    });
    cv.addEventListener('click', function(e){
      if(!placing || !cannonC) return;
      var b=cannonBox(), fx=(e.clientX-b.x)/b.w, fy=(e.clientY-b.y)/b.h;
      if(fx<0||fx>1||fy<0||fy>1){ note('Click on the cannon art.'); return; }
      ART.mz=[+fx.toFixed(4), +fy.toFixed(4)]; placing=false; dirty=true; note(); artChanged();
    });
    window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  }

  /* ---------- Fire button animation (frames measured from the screen recording: 60 per second) ---------- */
  // Waiting to fire: bright plate about 0.375 s, then medium, dark, medium (0.125 s each), 0.75 s in all, repeating.
  // Pressed: the plate bumps up and back and ends as the plain block (heights in picture pixels per 1/60 s frame), then stays plain until the wall is rebuilt.
  var FIRE_IMG=[], FIRE_BUMP=[6,18,30,36,36,42,42,42,36,30,18,6,-6,0];
  (ART.fire||[]).forEach(function(u,i){ var im=new Image(); im.onload=function(){ FIRE_IMG[i]=im; }; im.src=u; });
  var fireCv=document.getElementById('fireCv'), fireCx=fireCv.getContext('2d'), fireMode='idle', fireT0=0, fireLast=null;
  function fireTick(t){
    requestAnimationFrame(fireTick);
    if(state!==0) return;
    var im, up=0;
    if(fireMode==='idle'){
      var m=(t%750);
      im = m<375 ? FIRE_IMG[0] : (m<500 ? FIRE_IMG[1] : (m<625 ? FIRE_IMG[2] : FIRE_IMG[1]));
      fireLast=im;
    } else {
      im=FIRE_IMG[3];                // the plain end-state block, drawn at full strength (never dimmed)
      if(fireMode==='press'){ var f=Math.floor((t-fireT0)*60/1000); if(f>=FIRE_BUMP.length){ fireMode='off'; } else up=FIRE_BUMP[Math.max(0,f)]; }
    }
    var dp=window.devicePixelRatio||1, w=Math.round(fireCv.clientWidth*dp), h=Math.round(fireCv.clientHeight*dp);
    if(!w||!h||!im) return;
    if(fireCv.width!==w||fireCv.height!==h){ fireCv.width=w; fireCv.height=h; }
    var k=w/220;
    fireCx.clearRect(0,0,w,h); fireCx.imageSmoothingEnabled=false;
    fireCx.drawImage(im, 0, Math.round((48-up)*k), w, Math.round(96*k));
  }
  requestAnimationFrame(fireTick);

  /* ---------- Controls ---------- */
  var bFire=document.getElementById('btnFire'), bReset=document.getElementById('btnReset');
  var mBtns=[].slice.call(document.querySelectorAll('button.m')), sBtns=[].slice.call(document.querySelectorAll('button.s'));
  var menuOpen=false;
  function updateMenuBtn(){   // the button shows the current choice, made from the same pixel pictures as the menu
    var M=ART.menu, box=document.getElementById('menuSel'); if(!M||!box) return;
    var k=['m'+mass,'s'+speed].join();
    if(box.getAttribute('data-k')===k && box.firstChild) return; box.setAttribute('data-k',k); box.textContent='';
    ['m'+mass,'s'+speed].forEach(function(key){ var m=M[key]; if(!m) return; var im=new Image(); im.src=m.u; im.alt=''; im.draggable=false;
      im.style.width='calc(var(--ms)*'+m.w+'px)'; im.style.height='calc(var(--ms)*'+m.h+'px)'; box.appendChild(im); });
  }
  function syncUI(){
    if(phase!=='ready') menuOpen=false;
    document.body.classList.toggle('menuopen', PHONE && menuOpen);
    var mb=document.getElementById('menuBtn'); if(mb) mb.classList.toggle('hide', state!==0 || menuOpen);
    if(PHONE) updateMenuBtn();
    panel.style.display = state===0 ? ((PHONE && !menuOpen) ? 'none' : 'flex') : 'none'; bReset.style.display = state===0 ? 'block' : 'none'; bFire.style.display = state===0 ? 'block' : 'none'; placeEdit();
    if(editbar) editbar.style.display = state===0 ? 'grid' : 'none';
    var ready = phase==='ready';
    mBtns.forEach(function(b){ b.classList.toggle('sel', +b.dataset.v===mass); b.disabled=!ready; });
    sBtns.forEach(function(b){ b.classList.toggle('sel', +b.dataset.v===speed); b.disabled=!ready; });
    bFire.disabled=!ready;
    if(ready) fireMode='idle'; else if(fireMode==='idle'){ fireMode='press'; fireT0=performance.now(); }
  }
  mBtns.forEach(function(b){ b.addEventListener('click', function(){ if(phase==='ready'){ mass=+b.dataset.v; syncUI(); } }); });
  sBtns.forEach(function(b){ b.addEventListener('click', function(){ if(phase==='ready'){ speed=+b.dataset.v; syncUI(); } }); });
  document.getElementById('menuBtn').addEventListener('click', function(){ if(phase==='ready'){ menuOpen=true; syncUI(); } });
  document.getElementById('scrim').addEventListener('click', function(){ menuOpen=false; syncUI(); });
  document.getElementById('menuX').addEventListener('click', function(){ menuOpen=false; syncUI(); });
  bFire.addEventListener('click', fire);
  bReset.addEventListener('click', reset);

  window.addEventListener('keydown', function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key>='0' && e.key<='9'){ var i=+e.key; if(i<STATES.length) setState(i); }
  });

  /* ---------- Loop ---------- */
  var last=performance.now(), acc=0;
  function frame(now){
    var dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05; if(dt<0) dt=0;
    if(state===0){ acc+=dt*TIME_SCALE; var nSteps=0; while(acc>=DT && nSteps<4){ step(); acc-=DT; nSteps++; } if(nSteps>=4) acc=0; }
    if(state===0){ if(allAtRest()){ if(!settleT) settleT=now; } else settleT=0; if(cannonC) placeUI(); }
    cx.setTransform(dpr,0,0,dpr,0,0);
    drawScene();
    requestAnimationFrame(frame);
  }

  (function(){
    var m=(location.hash.replace('#','')||(/[?&]state=([^&]+)/.exec(location.search)||[])[1]||'');
    var i=STATES.indexOf(decodeURIComponent(m)); if(i>=0) state=i;
    if(EDIT) state=0;
  })();
  syncUI(); layout();
  function placeEdit(){ if(editbar && panel) editbar.style.left=(panel.offsetLeft+panel.offsetWidth+20)+'px'; }
  function applyFlash(){ document.documentElement.style.setProperty('--flash',(ART.flash||0.75)+'s'); }
  function applyFont(onfail){
    applyFlash();
    FS=ART.fs||20;
    function done(){ var r=document.documentElement.style; r.setProperty('--fs',FS+'px'); r.setProperty('--ms',textScale()); r.setProperty('--ff',FF); buildMenu(); placeEdit(); uiKey=''; }
    if(ART.font){
      var face=new FontFace('KEWFont','url('+ART.font+')');
      face.load().then(function(f){ if(curFace) document.fonts.delete(curFace); curFace=f; document.fonts.add(f); FF="'KEWFont',"+SANS; done(); })
        .catch(function(){ if(onfail) onfail(); });
    } else { if(curFace){ document.fonts.delete(curFace); curFace=null; } FF=SANS; done(); }
  }
  // Menu text. With a font loaded (Font file... in the editor) it is live text laid out like KE_Wall_Menu.svg (12 px font, 18 px lines,
  // letter-spacing -6 on the single spaces); without one it is the pixel picture cut from ke wall menu.png.
  var MENU_TXT={mass:'Mass', m10:'10 kg', m20:'20 kg', m30:'30 kg', m40:'40 kg', speed:'Speed', s5:'5 m/s', s10:'10 m/s', s15:'15 m/s', s20:'20 m/s'};
  var MENU_X={m10:18, m20:96, m30:174, m40:252, s5:24, s10:102, s15:192, s20:282};   // item starts in the SVG, in 12 px units
  function menuTextW(t){ return t.replace(/ /g,'').length*12 + (t.split(' ').length-1)*6; }
  function buildMenu(){
    var M=ART.menu, live=false;   // the menu is vector art from KE_Wall_Menu.svg (live text path kept for a font-based menu)
    document.getElementById('panel').classList.toggle('live', live);
    [].forEach.call(document.querySelectorAll('[data-img]'), function(el){
      var key=el.getAttribute('data-img'); el.textContent='';
      if(live){
        var sp=document.createElement('span'); sp.className='mt'; sp.textContent=MENU_TXT[key]; el.appendChild(sp);
        if(el.tagName==='BUTTON'){
          var prev=el.previousElementSibling, pk=prev&&prev.getAttribute('data-img'), pend = pk ? MENU_X[pk]+menuTextW(MENU_TXT[pk]) : 0;
          el.style.marginLeft='calc(var(--ms)*'+(MENU_X[key]-pend)+'px)';
        }
        return;
      }
      var m=M&&M[key]; if(!m) return;
      var im=new Image(); im.src=m.u; im.alt=''; im.draggable=false;
      im.style.width='calc(var(--ms)*'+m.w+'px)'; im.style.height='calc(var(--ms)*'+m.h+'px)';
      el.appendChild(im);
      if(el.tagName==='BUTTON'){
        var pv=el.previousElementSibling, pm=pv&&M[pv.getAttribute('data-img')], base=M[(key.charAt(0)==='m')?'mass':'speed'];
        el.style.marginLeft='calc(var(--ms)*'+(pm ? (m.x-(pm.x+pm.w)) : (m.x-base.x))+'px)';
      }
    });
  }
  loadNumImgs();
  applyFont();
  buildMenu();
  loadArt('cannon'); loadArt('bullet'); loadArt('bg'); loadArt('brick'); loadArt('bricktop');
  window.__kew={ get v(){ return v; }, get front(){ return front; }, get count(){ return count; }, get phase(){ return phase; }, get debris(){ return debris.length; }, get stepMs(){ return stepMs; },
    set:function(m,s){ mass=m; speed=s; syncUI(); }, fire:fire, reset:reset, serialize:serialize, art:ART, get nFin(){ return nFin; }, get E(){ return E_BRICK; }, get through(){ return through; }, get slabOn(){ return !!slab; }, slug:function(){ if(!slugBody) return null; var q=slugBody.getPosition(); return {x:q.x/S,y:q.y/S,st:slugBody.isStatic(),rest:slugRest,doneT:doneT}; },
    get geom(){ return {impactY:IMPACT_Y, slugL:SL_L, slugR:SL_R, canH:CAN_H, muzzleX:L.muzzleX, wallX:L.wallX, ppm:L.ppm}; } };
  requestAnimationFrame(frame);
})();
</script>
