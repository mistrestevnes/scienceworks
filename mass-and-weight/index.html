/* =====================================================================
   AeroLab theme v4 (Emerald on Deep Forest, quiet warm panels)
   A shared look for online science simulations. Warm, dimmed panels and
   quiet controls so the simulation carries the screen.

   HOW TO USE
   Paste this whole file inside a <style> block in index.html, after the
   page's own styles (best: a preview or published page shows only
   index.html). Or put it beside index.html and link it after the other
   styles: <link rel="stylesheet" href="aerolab.css">
   The font (Inter) is embedded below, so nothing is downloaded and the
   school filter cannot block it.

   CLASSES
     .aero-panel        card, sidebar or dialog
     .aero-bar          toolbar or control row
     .aero-stage        area for a video or simulation canvas
     .aero-btn-primary  emerald button, the one main action per area
     .aero-btn          plain button (every <button> already looks like this)
     .aero-chip         readout (Score 340): plain text, no box
     .aero-chip-warn    warning readout, the one tinted readout
     .aero-muted        secondary text
     .aero-data         numbers (fixed-width digits)
   Buttons with class="primary" or aria-pressed="true" also get the
   emerald style.

   LAYOUT RULES
   - Text may sit straight on the forest page. It is light there
     (--aero-ink-on-dark) and dark inside panels, bars and dialogs.
     Use the page for headings, questions, instructions and feedback.
   - Group related things into one panel. Inside a panel, separate parts
     with space, a heading or a thin line, not boxes inside boxes.
   - Box something on its own only if students click it as a whole (a
     choice card), it floats over other content (a dialog, a magnifier),
     or it holds a graph, table or form that needs a light background.
   - Leave var(--aero-page-bottom) clear below the last control.
   - The page header (title, links, top buttons) goes in .aero-header:
     no box, straight on the forest page, with room above it
     (var(--aero-page-top)) so nothing crowds the top edge.

   Every color the rules use is a token in :root, so changing a token
   changes the look.
   ===================================================================== */

:root {
  /* surfaces */
  --aero-stage: #0B1C15;         /* behind videos / dark canvases */
  --aero-page: #12291F;          /* page background (deep forest) */
  --aero-surface: #EDE9E0;       /* panels and bars: warm, dimmed off-white */
  --aero-panel-fill: linear-gradient(180deg, #F7F4EE 0%, #DFD9CD 100%); /* large panels: a subtle top-to-bottom fade */
  --aero-well: #F8F6F1;          /* inside text boxes and selects */
  --aero-raised: #D2CBBD;        /* plain buttons */
  --aero-raised-hover: #C7BFB0;
  --aero-raised-active: #BCB3A3;

  /* text */
  --aero-ink: #12291F;           /* body text */
  --aero-ink-muted: #4A564F;     /* secondary text */
  --aero-ink-on-dark: #E8EEEA;   /* text straight on the forest page (13:1) */
  --aero-muted-on-dark: #AFC2B8; /* secondary text on the page (8:1) */
  --aero-link-on-dark: #9FD3BA;

  /* lines */
  --aero-line: #D6CFC2;
  --aero-line-strong: #BEB6A7;
  --aero-btn-border: #A89E8C;    /* plain button edge */

  /* color, used sparingly */
  --aero-emerald: #1E5E46;       /* primary button */
  --aero-emerald-hover: #257052;
  --aero-emerald-active: #12432F;
  --aero-jade: #1E5E46;          /* links, slider and checkbox accent */
  --aero-select: rgba(30, 94, 70, .13); /* selected / hovered table rows */
  --aero-gold: #8A5A00;          /* warning text */
  --aero-gold-soft: #F3E2B3;
  --aero-disabled: #E3DFD7;
  --aero-disabled-ink: #545D57;

  /* type */
  --aero-font-body: "Inter AeroLab", "Inter", system-ui, sans-serif;
  --aero-font-code: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;

  /* shape and spacing */
  --aero-radius: 10px;
  --aero-radius-sm: 6px;
  --aero-control-h: 32px;
  --aero-page-top: 28px;         /* space above the page header */
  --aero-page-bottom: 48px;      /* space below the last control, so nobody mouses to the screen edge */
  --aero-focus: 0 0 0 2px #FFFFFF, 0 0 0 4px #12291F;

  color-scheme: light;
}

/* ---------- page ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0;
  color: var(--aero-ink-on-dark);
  background: var(--aero-page);
  padding-bottom: var(--aero-page-bottom);
  font-family: var(--aero-font-body);
  font-size: 18px;
  line-height: 1.5;
  letter-spacing: .02em;
  word-spacing: .08em;
  font-feature-settings: "cv05", "cv08"; /* l with a tail, I with serifs: never confused with each other or 1 */
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-weight: 600; line-height: 1.2; letter-spacing: 0; text-transform: none; margin: 0 0 .35em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .6em; }
a { color: var(--aero-link-on-dark); text-underline-offset: 2px; }
a:hover { color: var(--aero-ink-on-dark); }
:where(.aero-panel, .aero-bar, dialog) a { color: var(--aero-jade); }
:where(.aero-panel, .aero-bar, dialog) a:hover { color: var(--aero-ink); }
em, i { font-style: normal; font-weight: 600; } /* no italics, for readability */

.aero-muted { color: var(--aero-muted-on-dark); }
:where(.aero-panel, .aero-bar, dialog) .aero-muted { color: var(--aero-ink-muted); }
.aero-data, output { font-variant-numeric: tabular-nums; letter-spacing: 0; }
code, pre { font-family: var(--aero-font-code); letter-spacing: 0; word-spacing: 0; }

/* ---------- surfaces ---------- */
.aero-panel, dialog {
  background: var(--aero-surface);
  background-image: var(--aero-panel-fill);
  color: var(--aero-ink);
  border: 0;
  border-radius: var(--aero-radius);
  padding: 12px 16px;
}
dialog::backdrop { background: rgba(5, 12, 9, .6); }
.aero-bar {
  background: var(--aero-surface);
  color: var(--aero-ink);
  border-radius: var(--aero-radius);
  padding: 6px 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
}
.aero-stage {
  background: var(--aero-stage);
  border-radius: var(--aero-radius);
  overflow: hidden;
}

/* ---------- page header: no box, room above ---------- */
.aero-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: var(--aero-page-top) 24px 12px;
  color: var(--aero-ink-on-dark);
  background: none;
}
.aero-header h1, .aero-header h2 { margin: 0; }
.aero-header .aero-muted, .aero-header .aero-chip { color: var(--aero-muted-on-dark); }
.aero-header .aero-chip .aero-data { color: var(--aero-ink-on-dark); }

/* ---------- buttons: plain (default) ---------- */
button, .aero-btn {
  font: inherit;
  font-weight: 400;
  line-height: 1.2;
  min-height: var(--aero-control-h);
  padding: 3px 12px;
  border: 1px solid var(--aero-btn-border);
  border-radius: var(--aero-radius-sm);
  color: var(--aero-ink);
  background: var(--aero-raised);
  cursor: pointer;
  transition: background-color 100ms ease;
}
button:hover:not(:disabled), .aero-btn:hover:not(:disabled) { background: var(--aero-raised-hover); }
button:active:not(:disabled), .aero-btn:active:not(:disabled) { background: var(--aero-raised-active); }

/* ---------- buttons: emerald (primary) ---------- */
.aero-btn-primary, button.primary, button[aria-pressed="true"] {
  color: #FFFFFF;
  font-weight: 600;
  background: var(--aero-emerald);
  border-color: var(--aero-emerald-active);
}
.aero-btn-primary:hover:not(:disabled), button.primary:hover:not(:disabled), button[aria-pressed="true"]:hover:not(:disabled) { background: var(--aero-emerald-hover); }
.aero-btn-primary:active:not(:disabled), button.primary:active:not(:disabled), button[aria-pressed="true"]:active:not(:disabled) { background: var(--aero-emerald-active); }

/* ---------- disabled ---------- */
button:disabled, .aero-btn:disabled, .aero-btn-primary:disabled {
  cursor: not-allowed;
  opacity: 1;
  color: var(--aero-disabled-ink);
  background: var(--aero-disabled);
  border-color: var(--aero-line);
  font-weight: 400;
}

/* ---------- keyboard focus ---------- */
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible,
textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: none;
  box-shadow: var(--aero-focus) !important;
}

/* ---------- form controls ---------- */
select, input[type=text], input[type=number], textarea {
  font: inherit;
  color: var(--aero-ink);
  background: var(--aero-well);
  border: 1px solid var(--aero-line-strong);
  border-radius: var(--aero-radius-sm);
  min-height: var(--aero-control-h);
  padding: 2px 8px;
}
input[type=number] { font-variant-numeric: tabular-nums; letter-spacing: 0; }
input[type=range], input[type=checkbox], input[type=radio], progress { accent-color: var(--aero-jade); }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; margin: 0; vertical-align: middle; }
label { cursor: pointer; }

/* ---------- readouts ---------- */
.aero-chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  color: var(--aero-ink-muted);
  font-variant-numeric: tabular-nums;
}
.aero-chip + .aero-chip { margin-left: 12px; }
.aero-chip .aero-data { color: var(--aero-ink); font-weight: 600; }
.aero-chip-warn {
  color: var(--aero-gold);
  background: var(--aero-gold-soft);
  border-radius: var(--aero-radius-sm);
  padding: 2px 10px;
}

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 1rem; font-variant-numeric: tabular-nums; letter-spacing: 0; }
th { background: var(--aero-surface); text-align: right; font-weight: 400; color: var(--aero-ink-muted); padding: 4px 8px; border-bottom: 1px solid var(--aero-line-strong); }
td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--aero-line); }
tbody tr:hover td, tr.current td { background: var(--aero-select); }

/* ---------- details / explainers ---------- */
details { border-top: 1px solid var(--aero-line); padding-top: 8px; }
summary { cursor: pointer; color: var(--aero-link-on-dark); }
:where(.aero-panel, .aero-bar, dialog) summary { color: var(--aero-jade); }

/* ---------- motion ---------- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
</head>

// vertical: a real spring. The hand sets the top of the scale; the elephant obeys F = ma.
const K = 98000;          // N/m: the spring stretches 0.5 m under the Earth elephant's weight
const DAMP = 3500;        // N per m/s: a little friction so the bounce dies out in several seconds
const HAND_MAX = 1.0;     // m: how far the hand can raise the top of the scale
const SIDE_MAX = 10, SIDE_PX = 200;     // sideways: 0 to 10 N in 1 N steps, 20 px per newton

let mode = "up";
const pull = [0, 0];     // N, sideways pull on each elephant (separate handles)
const hand = [0, 0];      // m, height of the top of each scale above its slack position (separate handles)
const lift = PLACES.map(() => ({ y: 0, v: 0 }));   // elephant height above the track (m) and its velocity
const pxPerM = [200, 200];   // set each frame from the panel size
let drag = null;
const sim = PLACES.map(() => ({ x: 0, v: 0 }));

const instr = document.getElementById("instr");
let simDt = 0;           // seconds advanced in the last frame
function setInstr() {
  instr.textContent = mode === "up"
    ? "Drag up on a picture to pull that spring scale. Watch for the moment the elephant lifts."
    : "Drag right on a picture to pull that spring scale.";
}

function reset() {
  pull[0] = pull[1] = 0; hand[0] = hand[1] = 0;
  lift.forEach(L => { L.y = 0; L.v = 0; });
  sim.forEach(s => { s.x = 0; s.v = 0; });
}
function setMode(m) {
  mode = m; reset(); setInstr();
  document.getElementById("stages").classList.toggle("side-by-side", m === "up");
  document.getElementById("app").classList.toggle("page1", m === "up");
  document.getElementById("btnUp").setAttribute("aria-pressed", m === "up");
  document.getElementById("btnSide").setAttribute("aria-pressed", m === "side");
}
document.getElementById("btnUp").onclick = () => setMode("up");
document.getElementById("btnSide").onclick = () => setMode("side");
document.getElementById("btnReset").onclick = reset;

PLACES.forEach((p, idx) => {
  const st = document.getElementById(p.stage);
  st.addEventListener("pointerdown", e => {
    e.preventDefault();
    st.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, pull: mode === "up" ? hand[idx] : pull[idx], st };
    st.classList.add("dragging");
  });
  st.addEventListener("pointermove", e => {
    if (!drag || drag.st !== st) return;
    if (mode === "up") {
      const dy = drag.y - e.clientY;
      hand[idx] = clamp(drag.pull + dy / pxPerM[idx], 0, HAND_MAX);   // the handle follows the cursor
    } else {
      const dx = e.clientX - drag.x;
      pull[idx] = Math.round(clamp(drag.pull + dx * SIDE_MAX / SIDE_PX, 0, SIDE_MAX));
    }
  });
  const end = () => { drag = null; st.classList.remove("dragging"); };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
});

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function fmtN(f) { return (Math.round(f / 100) * 100).toLocaleString("en-US") + " N"; }

// ---------- drawing ----------
const INK = "#E8EEEA", MUTED = "#AFC2B8", LINE = "#5E7A6C", EMERALD = "#6FD0A4";
const LABEL = '18px "Helvetica Neue", Helvetica, Arial, sans-serif';
const READ = '700 24px "Inter AeroLab", Inter, sans-serif';
const MASS_FONT = '700 20px "Inter AeroLab", Inter, sans-serif';
const TICK_FONT = '15px "Helvetica Neue", Helvetica, Arial, sans-serif';
const ACC = '600 18px "Inter AeroLab", Inter, sans-serif';
const BODY_INK = "#12291F";
const FOOT_FRAC = 155 / 430;   // image includes a 5 px black outline on every side     // front toe position across the elephant image
const INSET_PX_PER_CM = 60;
const INSET_ZOOM = 3;          // how much the background is magnified inside the circle

function spring(ctx, x1, y1, x2, y2, coils, amp) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  const n = coils * 2;
  for (let i = 1; i < n; i++) {
    const t = i / n, s = (i % 2 ? 1 : -1) * amp;
    ctx.lineTo(x1 + dx * t + nx * s, y1 + dy * t + ny * s);
  }
  ctx.lineTo(x2, y2); ctx.stroke();
}

// Draws a spring scale from hook point (hx,hy) toward the hand, along unit (ux,uy).
// Returns nothing; reading drawn by caller.
function drawScale(ctx, hx, hy, ux, uy, stretchPx) {
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  const cord = 8, bodyLen = 18, link = 6, ring = 7;
  const ax = hx + ux * cord, ay = hy + uy * cord;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ax, ay); ctx.stroke();
  const bx = ax + ux * (12 + stretchPx), by = ay + uy * (12 + stretchPx);
  spring(ctx, ax, ay, bx, by, 6, 6);
  const cx = bx + ux * bodyLen / 2, cy = by + uy * bodyLen / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(uy, ux));
  ctx.fillStyle = "#2B4A3C"; ctx.fillRect(-bodyLen / 2, -8, bodyLen, 16);
  ctx.strokeRect(-bodyLen / 2, -8, bodyLen, 16);
  ctx.restore();
  const ex = bx + ux * bodyLen, ey = by + uy * bodyLen;
  const rx = ex + ux * link, ry = ey + uy * link;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(rx, ry); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(rx + ux * ring, ry + uy * ring, ring, 0, Math.PI * 2); ctx.stroke();
  return { hx: rx + ux * ring, hy: ry + uy * ring, bx: cx, by: cy };
}
const SCALE_FIXED = 8 + 12 + 18 + 6 + 14;   // scale length apart from the stretch

function draw(p, i) {
  const cv = document.getElementById(p.canvas);
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const boxH = mode === "side" ? 34 : 18;   // the frictionless surface
  const ground = H - boxH;
  const eh = mode === "side" ? clamp(H * 0.50, 60, 150) : clamp(H * 0.30, 50, 90);  // elephant height on screen
  const ew = eh * img.width / (img.height || 1);

  // photo background, scaled to cover the panel with its horizon at the same height on Earth and Moon
  const horizonY = ground - eh * 0.75;
  paintBg(ctx, p, W, H, horizonY);
  halo(ctx, true);

  const s = sim[i];
  let camX = mode === "side" ? s.x * PX_PER_M : 0;
  const ex0 = mode === "side" ? W * 0.35 : W * 0.5 - ew / 2;   // elephant left edge on screen
  const footX = ex0 + FOOT_FRAC * ew;                          // toe of the front foot; 0 m on the track

  // track
  ctx.save();
  halo(ctx, false);
  ctx.fillStyle = "#3A403D"; ctx.fillRect(0, ground, W, boxH);
  ctx.fillStyle = "#59615D"; ctx.fillRect(0, ground, W, 2);
  if (mode === "side") {
    ctx.font = TICK_FONT; ctx.fillStyle = INK; ctx.strokeStyle = "#B9C4BE"; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineWidth = 2;
    const step = 5;
    const tooFast = s.v * simDt * PX_PER_M > 20 || s.x > 1e12;
    if (!tooFast) {
      const firstM = Math.floor((s.x - footX / PX_PER_M) / step) * step;
      for (let m = firstM; ; m += step) {
        const sx = footX + (m - s.x) * PX_PER_M;
        if (sx > W + 40) break;
        if (sx < -40 || m < 0) continue;
        ctx.beginPath(); ctx.moveTo(sx, ground + 2); ctx.lineTo(sx, ground + 9); ctx.stroke();
        const lab = m.toLocaleString("en-US") + " m";
        if (ctx.measureText(lab).width < step * PX_PER_M - 8) ctx.fillText(lab, sx, ground + 13);
      }
    }
    ctx.textAlign = "left";
  }
  ctx.restore();

  // forces
  let force, liftPx = 0, stretchPx = 0;
  if (mode === "up") {
    const avail = ground - eh - 12 - SCALE_FIXED;   // room above the elephant for scale + rise
    pxPerM[i] = avail / (HAND_MAX + 0.05);
    const stretch = Math.max(0, hand[i] - lift[i].y);
    force = K * stretch;
    liftPx = lift[i].y * pxPerM[i];
    stretchPx = stretch * pxPerM[i];
  } else {
    force = pull[i];
  }

  // elephant
  const ey = ground - eh - liftPx;
  if (img.complete && img.width) ctx.drawImage(img, ex0, ey, ew, eh);

  ctx.font = READ; ctx.textBaseline = "middle";
  if (mode === "up") {
    const hx = ex0 + ew * 0.55, hy = ey + eh * 0.02;
    const r = drawScale(ctx, hx, hy, 0, -1, stretchPx);
    // mass on the elephant and the scale reading: bold white, thin black outline, drop shadow
    shadowText(ctx, MASS.toLocaleString("en-US") + " kg", ex0 + ew * 0.57, ey + eh * 0.36, MASS_FONT, "center", "middle");
    shadowText(ctx, fmtN(force), r.bx + 22, r.by, READ, "left", "middle");
  } else {
    drawInset(ctx, W, H, ground, footX, s.x, s.v * simDt * INSET_PX_PER_CM * 100 > 15 || s.x > 1e9, p, horizonY);
    drawBodyText(ctx, ex0 + ew * 0.57, ey + eh * 0.36, ex0 + ew * 0.5, Math.max(24, ey - 26), force / MASS);
    // scale off the rump to the right
    const hx = ex0 + ew * 0.97, hy = ey + eh * 0.42;
    const stretch = force / SIDE_MAX * 90;
    const r = drawScale(ctx, hx, hy, 1, 0, stretch);
    shadowText(ctx, force + " N", r.hx + 20, r.hy, READ, "left", "middle");
  }
}

function paintBg(ctx, p, W, H, horizonY) {
  const bi = p.img;
  if (!(bi.complete && bi.width)) return;
  const hz = p.horizon * bi.height;
  const sc = Math.max(W / bi.width, horizonY / hz, (H - horizonY) / (bi.height - hz));
  const dw = bi.width * sc, dh = bi.height * sc;
  ctx.drawImage(bi, (W - dw) / 2, horizonY - hz * sc, dw, dh);
}

// dark glow behind light drawing so it reads over bright photos
function halo(ctx, on) {
  ctx.shadowColor = on ? "rgba(0,0,0,0.9)" : "transparent";
  ctx.shadowBlur = on ? 5 : 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
}

// acceleration as a number with a stacked unit fraction (m over s²), dark text on the elephant
// bold white text with a thin black outline and a slight drop shadow
function shadowText(ctx, txt, x, y, font, align, baseline) {
  ctx.save();
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = baseline;
  ctx.lineJoin = "round"; ctx.lineWidth = 1.5; ctx.strokeStyle = "#000000";   // 0.75 px shows outside the letters
  ctx.shadowColor = "rgba(0,0,0,0.95)"; ctx.shadowBlur = 3; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
  ctx.strokeText(txt, x, y);
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "#FFFFFF"; ctx.fillText(txt, x, y);
  ctx.restore();
}

// mass on the elephant (same spot as page 1) and acceleration above it
function drawBodyText(ctx, cx, massY, accCx, accY, a) {
  const massTxt = MASS.toLocaleString("en-US") + " kg";
  ctx.save(); ctx.font = MASS_FONT;
  const massW = ctx.measureText(massTxt).width;
  const numTxt = a.toFixed(4);
  const numW = ctx.measureText(numTxt).width;
  const mW = ctx.measureText("m").width, sW = ctx.measureText("s").width;
  const supFont = '700 13px "Inter AeroLab", Inter, sans-serif';
  ctx.font = supFont; const supW = ctx.measureText("2").width;
  ctx.restore();
  shadowText(ctx, massTxt, cx, massY, MASS_FONT, "center", "middle");
  const x0 = cx - massW / 2;                          // the first 0 lines up with the 5 of the mass
  const fracW = Math.max(mW, sW + 2 * supW) + 4;      // bar is symmetric about the m and s
  shadowText(ctx, numTxt, x0, accY, MASS_FONT, "left", "middle");
  const fx = x0 + numW + 8, fmid = fx + fracW / 2;
  // fraction bar: black outline, then white
  ctx.save();
  ctx.lineCap = "butt";
  ctx.shadowColor = "rgba(0,0,0,0.95)"; ctx.shadowBlur = 3; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
  ctx.strokeStyle = "#000000"; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(fx - 0.75, accY); ctx.lineTo(fx + fracW + 0.75, accY); ctx.stroke();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(fx, accY); ctx.lineTo(fx + fracW, accY); ctx.stroke();
  ctx.restore();
  shadowText(ctx, "m", fmid, accY - 1, MASS_FONT, "center", "bottom");
  shadowText(ctx, "s", fmid, accY + 3, MASS_FONT, "center", "top");
  shadowText(ctx, "2", fmid + sW / 2 + 1, accY + 1, supFont, "left", "top");
}

// magnified circle in front of the elephant: close-up of the ruler under the front toe
function drawInset(ctx, W, H, ground, footX, xMeters, blurred, p, horizonY) {
  const R = clamp(H * 0.36, 60, 95);
  const cx = footX - R - 90, cy = clamp((ground) / 2 + 4, R + 8, ground - R - 6);
  // callout line from the circle to the toe
  const ang = Math.atan2(ground - cy, footX - cx);
  ctx.strokeStyle = MUTED; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx + R * Math.cos(ang), cy + R * Math.sin(ang)); ctx.lineTo(footX, ground); ctx.stroke();

  ctx.save();
  halo(ctx, false);
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = "#0B1C15"; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  const ry = cy - 6;                       // top edge of the ruler
  // the background, zoomed in around the toe
  ctx.save();
  ctx.translate(cx, ry); ctx.scale(INSET_ZOOM, INSET_ZOOM); ctx.translate(-footX, -ground);
  paintBg(ctx, p, W, H, horizonY);
  ctx.restore();
  // the toe, magnified: its front edge sits at the circle's center
  ctx.fillStyle = "rgb(150,156,160)";
  ctx.beginPath();
  ctx.moveTo(cx + R + 4, cy - R - 4); ctx.lineTo(cx + 10, cy - R - 4);
  ctx.quadraticCurveTo(cx, ry - R * 0.5, cx, ry); ctx.lineTo(cx + R + 4, ry); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#000000"; ctx.lineWidth = 4;                  // the elephant's black outline
  ctx.beginPath(); ctx.moveTo(cx + 10, cy - R - 4);
  ctx.quadraticCurveTo(cx, ry - R * 0.5, cx, ry); ctx.stroke();
  // the surface, same color as the real one, with the ruler on it
  ctx.fillStyle = "#3A403D"; ctx.fillRect(cx - R, ry, 2 * R, R + 12);
  ctx.fillStyle = "#59615D"; ctx.fillRect(cx - R, ry, 2 * R, 2);
  ctx.strokeStyle = "#B9C4BE";
  const mmPx = INSET_PX_PER_CM / 10;
  const toeMM = xMeters * 1000;
  const first = Math.floor(toeMM - R / mmPx) - 1, last = Math.ceil(toeMM + R / mmPx) + 1;
  ctx.font = LABEL; ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.lineWidth = 1.5;
  for (let mm = first; !blurred && mm <= last; mm++) {
    const x = cx + (mm - toeMM) * mmPx;
    const len = mm % 10 === 0 ? 20 : mm % 5 === 0 ? 13 : 7;
    ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x, ry + len); ctx.stroke();
    if (mm % 10 === 0) {
      const lab = (mm / 10).toLocaleString("en-US");
      if (ctx.measureText(lab).width < INSET_PX_PER_CM - 6) ctx.fillText(lab, x, ry + 22);
    }
  }
  ctx.fillStyle = MUTED; ctx.fillText("cm", cx, ry + 46);
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.textAlign = "left";
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (mode === "up") {
    const n = 20, h = dt / n;
    PLACES.forEach((p, i) => {
      const L = lift[i];
      for (let k = 0; k < n; k++) {
        const F = K * Math.max(0, hand[i] - L.y);           // spring pulls up (a slack cord pulls nothing)
        let a = (F - MASS * p.g - DAMP * L.v) / MASS;
        if (L.y <= 0 && a <= 0) { L.y = 0; L.v = 0; continue; }   // resting on the track: the track holds it
        L.v += a * h; L.y += L.v * h;
        if (L.y < 0) { L.y = 0; L.v = 0; }                   // lands on the track without bouncing
      }
    });
  }
  if (mode === "side") {
    simDt = dt;
    sim.forEach((s, i) => { const a = pull[i] / MASS; s.x += s.v * simDt + 0.5 * a * simDt * simDt; s.v += a * simDt; });
  }
  PLACES.forEach(draw);
  requestAnimationFrame(frame);
}
setInstr();
requestAnimationFrame(frame);
</script>
</body>
