<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galileo's Ramps</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&display=swap&text=0123456789.,+-');

  :root {
    --sky-top: #F8F1DA;
    --sky-bot: #EADFC0;
    --ink: #1F1A12;
    --ink-soft: rgba(60, 40, 20, 0.75);
    --accent: #B8571F;
    --accent-2: #7A4A1F;
    --panel: rgba(248, 241, 218, 0.96);
    --panel-border: #6B5835;
    --tab-bg: rgba(107, 88, 53, 0.09);
    --serif: 'Cormorant Garamond', 'Sorts Mill Goudy', Georgia, 'Times New Roman', serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--sky-top);
  }
  body {
    font-family: var(--serif);
    font-feature-settings: "onum" 1, "kern" 1;
    font-variant-numeric: oldstyle-nums;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    display: flex;
  }
  [hidden] { display: none !important; }

  /* ---------- Sidebar ---------- */
  .side {
    width: 236px;
    flex: none;
    height: 100%;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    padding: 16px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 2;
  }
  h1 {
    font-family: 'Sorts Mill Goudy', Georgia, serif;
    font-weight: 400;
    font-size: 25px;
    line-height: 1.1;
    letter-spacing: 0.01em;
  }
  .sub {
    margin-top: 3px;
    font-family: 'Sorts Mill Goudy', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: var(--accent-2);
  }
  .divider { height: 1px; background: rgba(107, 88, 53, 0.25); }

  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 5px;
  }
  .control label, .group-label {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .value { font-size: 16px; color: var(--accent); }
  .ends {
    display: flex; justify-content: space-between;
    font-style: italic; font-size: 13.5px; color: var(--ink-soft);
    margin-top: 1px;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none; appearance: none;
    background: transparent; height: 18px; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--ink); border: none; }
  input[type="range"]::-moz-range-track { height: 2px; background: var(--ink); border: none; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--ink); margin-top: -6.5px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--ink);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-row { display: flex; gap: 6px; }
  .btn {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--sky-top);
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.ghost:hover { color: var(--accent); border-color: var(--accent); background: transparent; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--ink); border-color: var(--ink); }
  .btn.ghost:disabled:hover { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
  .toggle {
    padding: 6px 8px;
    border: 1px solid var(--ink);
    background: transparent;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .toggle[aria-pressed="true"] { background: var(--ink); color: var(--sky-top); }
  .toggle:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }

  /* ---------- Main area ---------- */
  .main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .stage-wrap { position: relative; flex: 1; min-height: 0; }
  canvas#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .readout {
    position: absolute;
    top: 12px; right: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: 4px 4px 0 rgba(31, 26, 18, 0.08);
    padding: 7px 12px;
    font-size: 15px;
    line-height: 1.55;
    pointer-events: none;
    min-width: 196px;
  }
  .readout div { display: flex; justify-content: space-between; gap: 14px; }
  .readout b { font-weight: 700; color: var(--accent); }

  .prompt {
    position: absolute;
    left: 50%; top: 14px;
    transform: translateX(-50%);
    font-family: 'Sorts Mill Goudy', Georgia, serif;
    font-style: italic;
    font-size: 19px;
    color: var(--accent-2);
    pointer-events: none;
    white-space: nowrap;
  }

  .graphs {
    flex: none;
    height: 34%;
    min-height: 170px;
    max-height: 260px;
    display: flex;
    gap: 8px;
    padding: 8px;
    background: rgba(234, 223, 192, 0.65);
    border-top: 1px solid var(--panel-border);
  }
  .graph {
    flex: 1;
    min-width: 0;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }
  .graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .side {
      width: 100%; height: auto; max-height: 46%;
      border-right: none; border-bottom: 1px solid var(--panel-border);
      padding: 10px 12px; gap: 10px;
    }
    .main { height: auto; flex: 1; min-height: 0; }
    .graphs { flex-wrap: wrap; height: 40%; }
    .graph { flex: 1 1 45%; }
    .readout { font-size: 13.5px; min-width: 0; padding: 5px 8px; }
    .prompt { font-size: 15px; top: auto; bottom: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<aside class="side">
  <div>
    <h1>Galileo's Ramps</h1>
    <div class="sub">Where does the ball stop?</div>
  </div>
  <div class="divider"></div>

  <div class="control">
    <div class="control-row"><label for="gap">Distance between ramps</label><span class="value" id="gapVal"></span></div>
    <input type="range" id="gap" min="0" max="8" step="0.5" value="2">
  </div>
  <div class="control">
    <div class="control-row"><label for="h2">Height of second ramp</label><span class="value" id="h2Val"></span></div>
    <input type="range" id="h2" min="0" max="3" step="0.1" value="2">
  </div>
  <div class="control">
    <div class="control-row"><label for="fric">Friction</label></div>
    <input type="range" id="fric" min="0" max="100" step="1" value="80">
    <div class="ends"><span>None</span><span>Lots</span></div>
  </div>

  <div class="divider"></div>

  <div class="btn-row">
    <button class="btn" id="again" disabled>Run again</button>
  </div>
  <div class="btn-row">
    <button class="btn ghost" id="pause" disabled>Pause</button>
    <button class="btn ghost" id="reset">Reset</button>
  </div>

  <div class="divider"></div>

  <div>
    <div class="group-label">Graphs</div>
    <div class="toggle-grid">
      <button class="toggle" data-g="pos" aria-pressed="false">Position</button>
      <button class="toggle" data-g="vel" aria-pressed="false">Velocity</button>
      <button class="toggle" data-g="dist" aria-pressed="false">Distance</button>
      <button class="toggle" data-g="spd" aria-pressed="false">Speed</button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="stage-wrap" id="stageWrap">
    <canvas id="stage"></canvas>
    <div class="prompt" id="prompt">Drag the ball up the ramp and let go.</div>
    <div class="readout">
      <div><span>Release height</span><b id="rH">–</b></div>
      <div><span>Speed</span><b id="rS">0.00 m/s</b></div>
      <div><span>Distance traveled</span><b id="rD">0.00 m</b></div>
      <div><span>Time</span><b id="rT">0.0 s</b></div>
    </div>
  </div>
  <div class="graphs" id="graphs" hidden></div>
</div>

<script>
(() => {
'use strict';

// ===================== Physics constants =====================
// World units are meters and seconds. y is up. x = 0 is the back of ramp 1.
const g   = 9.81;
const RB  = 0.15;          // ball radius (m)
const H1  = 2.0;           // height of ramp 1 (fixed)
const R1  = 3.0;           // horizontal run of ramp 1 (fixed)
const R2  = 3.0;           // horizontal run of ramp 2 (fixed)
const FILLET = 0.6;        // radius of the rounded joins at the foot of each ramp (surface)
const C_MAX = 0.12;        // rolling-resistance coefficient at "Lots"
// Solid sphere rolling without slipping: translational acceleration is
// 5/7 of what a frictionless sliding object would have (I = 2/5 m r²).
const ROLL = 5 / 7;
// Ball landing on the floor after flying off ramp 2 (bronze on wood-ish).
const E_REST = 0.5;        // coefficient of restitution, vertical
const MU_IMPACT = 0.35;    // sliding friction during the brief impact
const SETTLE_VY = 0.3;     // below this rebound speed the ball settles into rolling

// ===================== State =====================
let gap = 2, h2 = 2, fricU = 80;
let path = null;           // main track (ramp 1 → floor → ramp 2)
let outer = null;          // floor beyond ramp 2 (only used when ramp 2 has height)
let xD = 0;                // x of ramp 2's top edge

const ball = {
  mode: 'placed',          // placed | dragging | track | air | stopped
  trackRef: null,          // which path the ball is on
  s: 0, v: 0,              // arc length along track and velocity along it
  E: 0,                    // mechanical energy per unit mass on the track
  x: 0, y: 0,              // center position
  vx: 0, vy: 0, w: 0,      // flight velocity and spin (ω·r in m/s)
  rot: 0,                  // drawn rotation angle
};
let releaseS = 1.0;        // where on ramp 1 the ball was released (arc length)
let releaseH = null;       // height of the ball's bottom at release (m); null = no line
let running = true;        // pause flag
let t = 0, posAlong = 0, dist = 0, speed = 0, vel = 0;
let started = false;

function cCoef() { const u = fricU / 100; return C_MAX * u * u; }

// ===================== Track geometry =====================
// The track is the path of the ball's CENTER: the ramp surfaces offset by
// the ball radius, with circular arcs where the surfaces meet. Each element
// is a line or an arc, parameterized by arc length.
function lineEl(p, ang, len) {
  return { type: 'line', p, ang, len, d: [Math.cos(ang), Math.sin(ang)] };
}
function arcEl(c, R, a0, dir, len) { return { type: 'arc', c, R, a0, dir, len }; }

function makePath(elements) {
  let s0 = 0;
  for (const e of elements) { e.s0 = s0; s0 += e.len; }
  return { els: elements, L: s0, hint: 0 };
}

// Position, tangent angle, curvature at arc length s.
function at(P, s) {
  const els = P.els;
  let i = Math.min(P.hint, els.length - 1);
  while (i > 0 && s < els[i].s0) i--;
  while (i < els.length - 1 && s > els[i].s0 + els[i].len) i++;
  P.hint = i;
  const e = els[i];
  const u = s - e.s0;
  if (e.type === 'line') {
    return { x: e.p[0] + e.d[0] * u, y: e.p[1] + e.d[1] * u, th: e.ang, k: 0 };
  }
  const a = e.a0 + e.dir * u / e.R;
  return { x: e.c[0] + e.R * Math.cos(a), y: e.c[1] + e.R * Math.sin(a), th: a + e.dir * Math.PI / 2, k: e.dir / e.R };
}

function lineIntersect(p, d, q, e) {
  const den = d[0] * e[1] - d[1] * e[0];
  const tt = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / den;
  return [p[0] + d[0] * tt, p[1] + d[1] * tt];
}

function buildTrack() {
  // Surface corner points.
  const P = [[0, H1], [R1, 0]];
  if (h2 > 0) {
    if (gap > 0) P.push([R1 + gap, 0]);
    P.push([R1 + gap + R2, h2]);
  } else {
    P.push([1e6, 0]);   // flat: the floor just keeps going
  }
  xD = P[P.length - 1][0];

  const segs = [];
  for (let i = 0; i < P.length - 1; i++) {
    const dx = P[i + 1][0] - P[i][0], dy = P[i + 1][1] - P[i][1];
    const len = Math.hypot(dx, dy);
    const d = [dx / len, dy / len];
    const n = [-d[1], d[0]];             // left normal = up, toward the ball
    segs.push({ d, n, ang: Math.atan2(d[1], d[0]), o: [P[i][0] + RB * n[0], P[i][1] + RB * n[1]] });
  }
  // Corner points of the center path.
  const Q = [segs[0].o];
  for (let i = 1; i < segs.length; i++) Q.push(lineIntersect(segs[i - 1].o, segs[i - 1].d, segs[i].o, segs[i].d));
  const last = segs[segs.length - 1];
  const Pl = P[P.length - 1];
  Q.push([Pl[0] + RB * last.n[0], Pl[1] + RB * last.n[1]]);

  const els = [];
  let cur = Q[0];
  const Rc = FILLET - RB;
  for (let i = 1; i < Q.length - 1; i++) {
    const din = segs[i - 1], dout = segs[i];
    let phi = dout.ang - din.ang;
    while (phi > Math.PI) phi -= 2 * Math.PI;
    while (phi < -Math.PI) phi += 2 * Math.PI;
    if (Math.abs(phi) < 1e-6) continue;
    const tanh = Math.tan(Math.abs(phi) / 2);
    let tlen = Rc * tanh;
    const lim = 0.45 * Math.min(Math.hypot(Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]),
                                Math.hypot(Q[i + 1][0] - Q[i][0], Q[i + 1][1] - Q[i][1]));
    tlen = Math.min(tlen, lim);
    const R = tlen / tanh;
    const T1 = [Q[i][0] - tlen * din.d[0], Q[i][1] - tlen * din.d[1]];
    const dir = Math.sign(phi);
    const nIn = [-din.d[1] * dir, din.d[0] * dir];
    const c = [T1[0] + R * nIn[0], T1[1] + R * nIn[1]];
    const a0 = Math.atan2(T1[1] - c[1], T1[0] - c[0]);
    els.push(lineEl(cur, din.ang, Math.hypot(T1[0] - cur[0], T1[1] - cur[1])));
    els.push(arcEl(c, R, a0, dir, R * Math.abs(phi)));
    cur = [Q[i][0] + tlen * dout.d[0], Q[i][1] + tlen * dout.d[1]];
  }
  const endQ = Q[Q.length - 1];
  els.push(lineEl(cur, last.ang, Math.hypot(endQ[0] - cur[0], endQ[1] - cur[1])));
  if (h2 > 0) {
    // Rolling over the top edge: the center swings around the corner.
    const a0 = last.ang + Math.PI / 2;
    els.push(arcEl([Pl[0], Pl[1]], RB, a0, -1, RB * a0));
  }
  path = makePath(els);
  outer = makePath([lineEl([xD, RB], 0, 1e6)]);
}

// The part of ramp 1 the ball can be dragged along.
function ramp1Range() {
  const e = path.els[0];
  return { sMin: 0.35, sMax: Math.max(0.4, e.len - 0.02) };
}

// ===================== Ball control =====================
function placeAt(s) {
  const r = ramp1Range();
  s = Math.max(r.sMin, Math.min(r.sMax, s));
  ball.trackRef = path;
  ball.s = s; ball.v = 0;
  const q = at(path, s);
  ball.x = q.x; ball.y = q.y;
  return s;
}

function resetMotionRecord() {
  t = 0; posAlong = 0; dist = 0; speed = 0; vel = 0;
  data.t.length = 0; data.pos.length = 0; data.vel.length = 0; data.dist.length = 0; data.spd.length = 0;
  for (const k in yRange) yRange[k] = null;
}

function release() {
  releaseS = placeAt(ball.s);
  releaseH = ball.y - RB;
  ball.mode = 'track';
  ball.v = 0;
  ball.E = g * ball.y;
  resetMotionRecord();
  sample();
  running = true;
  started = true;
  document.getElementById('prompt').hidden = true;
  syncButtons();
}

function runAgain() {
  ball.mode = 'placed';
  placeAt(releaseS);
  release();
}

function resetAll() {
  ball.mode = 'placed';
  releaseH = null;
  placeAt(path.els[0].len * 0.45);
  ball.rot = 0;
  resetMotionRecord();
  running = true;
  cam.x = cam.home;
  syncButtons();
}

// ===================== Integration =====================
const DT = 1 / 1200;

function stepTrack(dt) {
  const P = ball.trackRef;
  const c = cCoef();
  const q = at(P, ball.s);
  const sn = Math.sin(q.th), cs = Math.cos(q.th);
  const N = g * cs + q.k * ball.v * ball.v;      // normal force per unit mass
  if (q.k < 0 && N < 0) { launch(q); return; }   // leaves the edge
  const f = c * Math.max(N, 0);                  // rolling resistance per unit mass
  const ag = -g * sn;

  if (ball.v === 0) {
    if (Math.abs(ag) <= f + 1e-12) {             // resistance holds it: it has stopped
      ball.mode = 'stopped'; ball.E = g * q.y; return;
    }
    ball.v = ROLL * (ag - Math.sign(ag) * f) * dt;
  } else {
    const vn = ball.v + ROLL * (ag - Math.sign(ball.v) * f) * dt;
    if (vn * ball.v < 0) ball.v = 0;             // turning point (or stop) — decided next step
    else ball.v = vn;
  }
  const ds = ball.v * dt;
  ball.s += ds;
  ball.E -= f * Math.abs(ds);
  posAlong += ds; dist += Math.abs(ds);
  ball.rot += ds / RB;

  if (ball.s >= P.L) { launch(at(P, P.L)); return; }
  if (ball.s < 0) { ball.s = 0; ball.v = 0; }

  const q2 = at(P, ball.s);
  ball.x = q2.x; ball.y = q2.y;
  // Keep energy exact (KE of a rolling sphere = 7/10 m v²), so heights reached
  // depend only on the energy friction has actually removed.
  // (Skipped in the last few mm/s before a turning point or a stop, where
  // plain integration takes over; otherwise rounding can hold the ball at a
  // crawl forever.)
  if (ball.v !== 0) {
    const ke = ball.E - g * q2.y;
    if (ke > 1e-4) ball.v = Math.sign(ball.v) * Math.sqrt((10 / 7) * ke);
  }
  vel = ball.v; speed = Math.abs(ball.v);
}

function launch(q) {
  ball.mode = 'air';
  ball.x = q.x; ball.y = q.y;
  ball.vx = ball.v * Math.cos(q.th);
  ball.vy = ball.v * Math.sin(q.th);
  ball.w = ball.v;                                // still spinning at the rolling rate
}

function stepAir(dt) {
  ball.vy -= g * dt;
  const dx = ball.vx * dt, dy = ball.vy * dt;
  ball.x += dx; ball.y += dy;
  const dl = Math.hypot(dx, dy);
  posAlong += Math.sign(ball.vx || 1) * dl; dist += dl;
  ball.rot += ball.w * dt / RB;
  speed = Math.hypot(ball.vx, ball.vy);
  vel = Math.sign(ball.vx || 1) * speed;

  if (ball.y <= RB && ball.vy < 0 && ball.x > xD) {
    ball.y = RB;
    const vin = -ball.vy;
    const Jn = (1 + E_REST) * vin;                // normal impulse per unit mass
    const slip = ball.vx - ball.w;                // contact-point velocity
    const need = (2 / 7) * Math.abs(slip);
    if (MU_IMPACT * Jn >= need) {                 // friction catches it: rolling
      ball.vx -= (2 / 7) * slip;
      ball.w = ball.vx;
    } else {                                      // it skids through the impact
      const sg = Math.sign(slip);
      ball.vx -= sg * MU_IMPACT * Jn;
      ball.w += sg * 2.5 * MU_IMPACT * Jn;
    }
    ball.vy = E_REST * vin;
    if (ball.vy < SETTLE_VY) {
      const v = (5 * ball.vx + 2 * ball.w) / 7;   // skid settles into rolling
      ball.mode = 'track';
      ball.trackRef = outer;
      outer.hint = 0;
      ball.s = ball.x - xD;
      ball.v = v;
      ball.E = 0.7 * v * v + g * RB;
      ball.y = RB;
    }
  }
}

function physics(dtFrame) {
  let n = Math.round(dtFrame / DT);
  for (let i = 0; i < n; i++) {
    if (ball.mode === 'track') stepTrack(DT);
    else if (ball.mode === 'air') stepAir(DT);
    else break;
    t += DT;
  }
  if (ball.mode === 'stopped') { speed = 0; vel = 0; }
}

// ===================== Data for graphs =====================
const data = { t: [], pos: [], vel: [], dist: [], spd: [] };
const yRange = { pos: null, vel: null, dist: null, spd: null };
let sampleAcc = 0;
function sample() {
  data.t.push(t); data.pos.push(posAlong); data.vel.push(vel); data.dist.push(dist); data.spd.push(speed);
  if (data.t.length > 6000) {
    for (const k in data) data[k] = data[k].filter((_, i) => i % 2 === 0);
  }
}

// ===================== Rendering =====================
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const wrap = document.getElementById('stageWrap');
let W = 0, H = 0, dpr = 1;
const GROUND_PX = 56;
const cam = { x: -0.7, home: -0.7, scale: 100 };

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
  fitCamera();
  for (const gname in graphCanvases) sizeGraph(gname);
}

function fitCamera() {
  const left = -0.7, right = R1 + gap + R2 + 1.1;
  const top = Math.max(H1, h2) + 0.75;
  const availH = H - GROUND_PX - 10;
  cam.scale = Math.max(20, Math.min(W / (right - left), availH / top));
  cam.home = left;
  if (ball.mode !== 'track' && ball.mode !== 'air') cam.x = cam.home;
}
const viewW = () => W / cam.scale;
const groundY = () => H - GROUND_PX;
const X = (x) => (x - cam.x) * cam.scale;
const Y = (y) => groundY() - y * cam.scale;

function updateCamera() {
  const vw = viewW();
  if (ball.mode === 'track' || ball.mode === 'air' || ball.mode === 'stopped') {
    // Only follow once the ball heads past the apparatus
    const F = Math.max(0.75 * vw, xD + 0.4 - cam.home);
    let target = cam.x;
    if (ball.x > cam.x + F) target = ball.x - F;
    if (ball.x < cam.x + 0.3 * vw) target = ball.x - 0.3 * vw;
    cam.x = Math.max(cam.home, target);
  } else {
    cam.x += (cam.home - cam.x) * 0.18;
    if (Math.abs(cam.x - cam.home) < 1e-3) cam.x = cam.home;
  }
}

function surfacePoints() {
  // Ramp surface, from the track: center path offset back down by the radius.
  const pts = [];
  const xMax = cam.x + viewW() + 2;
  for (const e of path.els) {
    const n = e.type === 'line' ? 2 : 28;
    for (let i = 0; i <= n; i++) {
      let s = e.s0 + e.len * i / n;
      const q = at(path, s);
      let px = q.x + RB * Math.sin(q.th), py = q.y - RB * Math.cos(q.th);
      if (px > xMax) { px = xMax; }
      pts.push([px, py]);
      if (px >= xMax) return pts;
    }
  }
  return pts;
}

function hatchClip(drawShape, color, lineColor) {
  ctx.save();
  ctx.beginPath(); drawShape(); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.clip();
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  const step = 14;
  const off = ((cam.x * cam.scale) % step + step) % step;
  for (let x = -H - off; x < W + H; x += step) { ctx.moveTo(x, H); ctx.lineTo(x + H, 0); }
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#F8F1DA'); sky.addColorStop(0.7, '#F2E8CD'); sky.addColorStop(1, '#EADFC0');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Faint meter grid
  ctx.strokeStyle = 'rgba(130, 100, 55, 0.13)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const m0 = Math.floor(cam.x), m1 = Math.ceil(cam.x + viewW());
  for (let m = m0; m <= m1; m++) { const px = Math.round(X(m)) + 0.5; ctx.moveTo(px, 0); ctx.lineTo(px, groundY()); }
  for (let m = 1; Y(m) > 0; m++) { const py = Math.round(Y(m)) + 0.5; ctx.moveTo(0, py); ctx.lineTo(W, py); }
  ctx.stroke();

  // Floor
  const gy = groundY();
  hatchClip(() => { ctx.rect(0, gy, W, GROUND_PX); }, '#2F2518', 'rgba(245, 222, 179, 0.13)');

  // Ramps (solid wedges standing on the floor)
  const pts = surfacePoints();
  const lastPt = pts[pts.length - 1];
  hatchClip(() => {
    ctx.moveTo(X(0), Y(0));
    for (const p of pts) ctx.lineTo(X(p[0]), Y(p[1]));
    ctx.lineTo(X(lastPt[0]), Y(0));
  }, '#7A5A34', 'rgba(40, 26, 10, 0.22)');
  // Ink outline of the running surface
  ctx.strokeStyle = '#1A1308';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(0), Y(H1));
  for (const p of pts) ctx.lineTo(X(p[0]), Y(p[1]));
  if (h2 > 0) ctx.lineTo(X(lastPt[0]), Y(0));
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(W, gy + 0.5); ctx.stroke();

  // Floor ticks and labels — these scroll past when the camera follows the ball
  ctx.fillStyle = 'rgba(245, 232, 196, 0.9)';
  ctx.font = '600 14px "Cormorant Garamond", "Sorts Mill Goudy", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const labelEvery = Math.max(1, Math.ceil(40 / cam.scale));
  for (let h = Math.floor(cam.x * 2); h <= Math.ceil((cam.x + viewW()) * 2); h++) {
    const m = h / 2;
    if (m < 0) continue;
    const px = Math.round(X(m));
    const major = h % 2 === 0;
    ctx.fillRect(px, gy + 1, major ? 2 : 1, major ? 11 : 6);
    if (major && m % labelEvery === 0) ctx.fillText(m + ' m', px, gy + 15);
  }

  // Height scale on the back of ramp 1
  if (X(0) > -40) {
    ctx.fillStyle = 'rgba(60, 40, 20, 0.85)';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '600 14px "Cormorant Garamond", "Sorts Mill Goudy", serif';
    for (let m = 0.5; Y(m) > 8; m += 0.5) {
      const py = Math.round(Y(m));
      const major = Math.abs(m - Math.round(m)) < 1e-9;
      ctx.fillRect(X(0) - (major ? 10 : 6), py, major ? 10 : 6, 1);
      if (major) ctx.fillText(m + ' m', X(0) - 13, py);
    }
  }

  // Release-height line
  if (releaseH !== null && ball.mode !== 'dragging') {
    const py = Math.round(Y(releaseH)) + 0.5;
    ctx.save();
    ctx.strokeStyle = '#B8571F';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([9, 6]);
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = 'italic 16px "Sorts Mill Goudy", Georgia, serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const label = 'release height ' + releaseH.toFixed(2) + ' m';
    const tw = ctx.measureText(label).width;
    const lx = W - tw - 14;
    ctx.fillStyle = 'rgba(248, 241, 218, 0.94)';
    ctx.fillRect(lx - 5, py - 11, tw + 10, 22);
    ctx.strokeStyle = 'rgba(184, 87, 31, 0.7)'; ctx.lineWidth = 1;
    ctx.strokeRect(lx - 5 + 0.5, py - 11 + 0.5, tw + 10, 22);
    ctx.fillStyle = '#B8571F';
    ctx.fillText(label, lx, py + 1);
    ctx.restore();
  }

  drawBall();
}

function drawBall() {
  const px = X(ball.x), py = Y(ball.y);
  const r = RB * cam.scale;
  // Shadow on the floor when flying
  if (ball.mode === 'air') {
    const hAbove = Math.max(0, ball.y - RB);
    ctx.fillStyle = `rgba(31, 26, 18, ${Math.max(0.05, 0.22 - hAbove * 0.05)})`;
    ctx.beginPath();
    ctx.ellipse(px, groundY() - 1, r / (1 + hAbove * 0.4), r * 0.22 / (1 + hAbove * 0.4), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(px, py);
  // Bronze — Galileo's balls were bronze. Highlight stays put (lit from above-left).
  const grad = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
  grad.addColorStop(0, '#E8C27E'); grad.addColorStop(0.55, '#A8702E'); grad.addColorStop(1, '#55320F');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2A1606'; ctx.lineWidth = 1.5; ctx.stroke();
  // Spin marks — a band and a dot that turn with the ball
  ctx.rotate(ball.rot);
  ctx.strokeStyle = 'rgba(31, 20, 8, 0.85)';
  ctx.lineWidth = Math.max(1.5, r * 0.16);
  ctx.beginPath(); ctx.moveTo(-r * 0.92, 0); ctx.lineTo(r * 0.92, 0); ctx.stroke();
  ctx.fillStyle = '#F6E2B0';
  ctx.beginPath(); ctx.arc(0, -r * 0.55, Math.max(2, r * 0.17), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (ball.mode === 'placed' && !started) {
    ctx.strokeStyle = '#B8571F'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(px, py, r + 6, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ===================== Graphs =====================
const GRAPHS = {
  pos:  { title: 'Position along the path (m)', key: 'pos',  signed: true  },
  vel:  { title: 'Velocity (m/s)',              key: 'vel',  signed: true  },
  dist: { title: 'Distance traveled (m)',       key: 'dist', signed: false },
  spd:  { title: 'Speed (m/s)',                 key: 'spd',  signed: false },
};
const ORDER = ['pos', 'vel', 'dist', 'spd'];
const graphCanvases = {};
const graphsEl = document.getElementById('graphs');

function niceStep(range, target) {
  const raw = range / target;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}

function setGraph(name, on) {
  if (on && !graphCanvases[name]) {
    const box = document.createElement('div');
    box.className = 'graph';
    const cv = document.createElement('canvas');
    box.appendChild(cv);
    graphCanvases[name] = { box, cv };
  }
  if (!on && graphCanvases[name]) { graphCanvases[name].box.remove(); delete graphCanvases[name]; }
  graphsEl.innerHTML = '';
  let any = false;
  for (const k of ORDER) if (graphCanvases[k]) { graphsEl.appendChild(graphCanvases[k].box); any = true; }
  graphsEl.hidden = !any;
  resize();
}

function sizeGraph(name) {
  const gc = graphCanvases[name];
  const w = gc.box.clientWidth, h = gc.box.clientHeight;
  gc.w = w; gc.h = h;
  gc.cv.width = Math.round(w * dpr); gc.cv.height = Math.round(h * dpr);
}

function drawGraph(name) {
  const gc = graphCanvases[name];
  const spec = GRAPHS[name];
  const c = gc.cv.getContext('2d');
  const w = gc.w, h = gc.h;
  if (!w || !h) return;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  const L = 44, Rm = 10, T = 24, B = 26;
  const pw = w - L - Rm, ph = h - T - B;

  const ys = data[spec.key], ts = data.t;
  // y range only grows during a run, so the axes don't jitter
  let lo = 0, hi = 1;
  for (const v of ys) { if (v < lo) lo = v; if (v > hi) hi = v; }
  let yr = yRange[name];
  if (!yr) yr = yRange[name] = { lo: 0, hi: 1 };
  yr.lo = Math.min(yr.lo, lo); yr.hi = Math.max(yr.hi, hi);
  const ystep = niceStep(yr.hi - yr.lo, 4);
  const ylo = Math.floor(yr.lo / ystep + 1e-9) * ystep;
  const yhi = Math.ceil(yr.hi / ystep - 1e-9) * ystep;
  const tmaxRaw = Math.max(5, ts.length ? ts[ts.length - 1] : 0);
  const tstep = niceStep(tmaxRaw, 5);
  const tmax = Math.ceil(tmaxRaw / tstep) * tstep;

  const gx = (tt) => L + tt / tmax * pw;
  const gy = (v) => T + (yhi - v) / (yhi - ylo) * ph;

  c.font = '600 12.5px "Cormorant Garamond", "Sorts Mill Goudy", serif';
  c.strokeStyle = 'rgba(130, 100, 55, 0.18)'; c.lineWidth = 1;
  c.fillStyle = '#3A2810';
  c.beginPath();
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let v = ylo; v <= yhi + ystep * 1e-6; v += ystep) {
    const y = Math.round(gy(v)) + 0.5;
    c.moveTo(L, y); c.lineTo(L + pw, y);
    c.fillText(+v.toFixed(6) + '', L - 5, y);
  }
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let tt = 0; tt <= tmax + tstep * 1e-6; tt += tstep) {
    const x = Math.round(gx(tt)) + 0.5;
    c.moveTo(x, T); c.lineTo(x, T + ph);
    c.fillText(+tt.toFixed(6) + '', x, T + ph + 4);
  }
  c.stroke();
  // Axes
  c.strokeStyle = '#1F1A12'; c.lineWidth = 1.2;
  c.beginPath();
  c.moveTo(L + 0.5, T); c.lineTo(L + 0.5, T + ph); c.lineTo(L + pw, T + ph);
  if (ylo < 0) { const z = Math.round(gy(0)) + 0.5; c.moveTo(L, z); c.lineTo(L + pw, z); }
  c.stroke();
  // Title and time label
  c.fillStyle = '#1F1A12';
  c.font = '700 14px "Cormorant Garamond", "Sorts Mill Goudy", serif';
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText(spec.title, L, 5);
  c.font = 'italic 13px "Sorts Mill Goudy", Georgia, serif';
  c.textAlign = 'right';
  c.fillStyle = 'rgba(60, 40, 20, 0.75)';
  c.fillText('time (s)', L + pw, 6);
  // Trace
  if (ys.length > 1) {
    c.strokeStyle = '#B8571F'; c.lineWidth = 2; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(gx(ts[0]), gy(ys[0]));
    for (let i = 1; i < ys.length; i++) c.lineTo(gx(ts[i]), gy(ys[i]));
    c.stroke();
  }
}

// ===================== Input =====================
let dragOffset = null;
function toWorld(ev) {
  const r = stage.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  return [sx / cam.scale + cam.x, (groundY() - sy) / cam.scale];
}
function projectOnRamp1(p) {
  const e = path.els[0];
  const u = (p[0] - e.p[0]) * e.d[0] + (p[1] - e.p[1]) * e.d[1];
  return u;
}
stage.addEventListener('pointerdown', (ev) => {
  const p = toWorld(ev);
  const dpx = (p[0] - ball.x) * cam.scale, dpy = (p[1] - ball.y) * cam.scale;
  const hit = Math.hypot(dpx, dpy) <= RB * cam.scale + 16;
  if (!hit) return;
  stage.setPointerCapture(ev.pointerId);
  ball.mode = 'dragging';
  releaseH = null;
  ball.rot = 0;
  // If the ball was away from ramp 1, it comes back to where the pointer is
  placeAt(projectOnRamp1(p));
  syncButtons();
  ev.preventDefault();
});
stage.addEventListener('pointermove', (ev) => {
  const p = toWorld(ev);
  if (ball.mode === 'dragging') {
    placeAt(projectOnRamp1(p));
  } else {
    const near = Math.hypot((p[0] - ball.x) * cam.scale, (p[1] - ball.y) * cam.scale) <= RB * cam.scale + 16;
    stage.style.cursor = near ? 'grab' : 'default';
  }
});
function endDrag(ev) {
  if (ball.mode !== 'dragging') return;
  try { stage.releasePointerCapture(ev.pointerId); } catch (_) {}
  release();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// Controls
const gapEl = document.getElementById('gap');
const h2El = document.getElementById('h2');
const fricEl = document.getElementById('fric');
const againBtn = document.getElementById('again');
const pauseBtn = document.getElementById('pause');

function geometryChanged() {
  gap = +gapEl.value; h2 = +h2El.value;
  document.getElementById('gapVal').textContent = gap.toFixed(1) + ' m';
  document.getElementById('h2Val').textContent = h2.toFixed(1) + ' m';
  const wasMoving = ball.mode === 'track' || ball.mode === 'air' || ball.mode === 'stopped';
  buildTrack();
  if (wasMoving) {
    // A new layout means a new run: put the ball back where it was released.
    ball.mode = 'placed';
    placeAt(releaseS);
    ball.rot = 0;
    resetMotionRecord();
    cam.x = cam.home;
  } else {
    placeAt(ball.s);
  }
  fitCamera();
  syncButtons();
}
gapEl.addEventListener('input', geometryChanged);
h2El.addEventListener('input', geometryChanged);
fricEl.addEventListener('input', () => {
  fricU = +fricEl.value;
  // If the ball had come to rest and friction is lowered, let it go on
  if (ball.mode === 'stopped') { ball.mode = 'track'; ball.v = 0; }
});
againBtn.addEventListener('click', runAgain);
pauseBtn.addEventListener('click', () => { running = !running; syncButtons(); });
document.getElementById('reset').addEventListener('click', resetAll);
document.querySelectorAll('.toggle').forEach((b) => {
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    setGraph(b.dataset.g, on);
  });
});

function syncButtons() {
  againBtn.disabled = releaseH === null;
  const moving = ball.mode === 'track' || ball.mode === 'air';
  pauseBtn.disabled = !moving && running;
  pauseBtn.textContent = running ? 'Pause' : 'Play';
}

// Readouts
const rH = document.getElementById('rH'), rS = document.getElementById('rS');
const rD = document.getElementById('rD'), rT = document.getElementById('rT');
function updateReadout() {
  rH.textContent = releaseH === null ? '–' : releaseH.toFixed(2) + ' m';
  rS.textContent = speed.toFixed(2) + ' m/s';
  rD.textContent = dist.toFixed(2) + ' m';
  rT.textContent = t.toFixed(1) + ' s';
}

// ===================== Main loop =====================
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running && (ball.mode === 'track' || ball.mode === 'air')) {
    physics(dt);
    sampleAcc += dt;
    if (sampleAcc >= 1 / 30) { sampleAcc = 0; sample(); }
    if (ball.mode === 'stopped') { sample(); syncButtons(); }
  }
  updateCamera();
  draw();
  for (const k in graphCanvases) drawGraph(k);
  updateReadout();
  requestAnimationFrame(frame);
}

// Test hook (harmless for students): lets automated checks drive the sim.
window._sim = { ball, get releaseH() { return releaseH; }, get t() { return t; }, get dist() { return dist; },
  physics, release, placeAt, get path() { return path; }, cCoef, setFric: (u) => { fricU = u; fricEl.value = u; } };

gapEl.value = gap; h2El.value = h2; fricEl.value = fricU;
buildTrack();
document.getElementById('gapVal').textContent = gap.toFixed(1) + ' m';
document.getElementById('h2Val').textContent = h2.toFixed(1) + ' m';
placeAt(path.els[0].len * 0.45);
window.addEventListener('resize', resize);
resize();
syncButtons();
requestAnimationFrame(frame);
})();
</script>
