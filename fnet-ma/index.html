</style>

<style>

<body>
<div class="aero-stage">
  <canvas id="cv"></canvas>
  <div class="float leftcol">
    <div class="aero-panel qbox">
      <div class="tag" id="progress"></div>
      <p id="question"></p>
      <div class="howbox" id="howbox" hidden></div>
    </div>
  </div>
  <div class="aero-panel float walkbox" id="walk" hidden></div>
  <div class="aero-panel float feedback" id="feedback"></div>
  <div class="float centerbtn"><button id="checkBtn" class="primary">Check Answer</button></div>
  <div class="aero-panel float titlebox"><span class="aero-title">F<sub>net</sub> = ma</span></div>
  <div class="float rightcol">
    <div class="btnrow">
      <button id="howBtn" hidden>Show me how</button>
    </div>
    <div class="levelrow">
      <button data-level="1" aria-pressed="true">Level 1</button>
      <button data-level="2">Level 2</button>
      <button data-level="3">Level 3</button>
      <button data-level="4">Level 4</button>
    </div>
  </div>
</div>

<script>
const MAXF = 20;                      // forces go in 1 N steps, 0 to 20 N
const DIRS = { N:[0,-1], S:[0,1], E:[1,0], W:[-1,0] };
const NAMES = { N:"North", S:"South", E:"East", W:"West" };
const OPP = { N:'S', S:'N', E:'W', W:'E' };
const LOCKED_COLOR = '#E8B04B';

let level = 1, l1Index = 0, q = null, drag = null;
let forces = {N:0,S:0,E:0,W:0}, locked = {};

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, cx = 0, cy = 0, scale = 8, dpr = 1;

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function sign(d){ return (d==='E'||d==='N') ? 1 : -1; }
function axisOf(d){ return (d==='E'||d==='W') ? 'x' : 'y'; }

/* ---------------- Level 1: net force questions (10 in order) ----------------
   1-2   net force in a diagonal direction, any size
   3     one locked force, opposite the target (overpower it)
   4     one locked force in the target direction, bigger than the target (cut it back)
   5     one locked force sideways to the target (cancel it exactly)
   6-7   two locked forces: one sideways, one along the target axis
   8-10  a given net force in two directions, one locked force on each axis
   Every lock is chosen so the question can always be solved.            */
const L1_COUNT = 10;
const B = t => `<b>${t}</b>`;
const LEAD = 'Adjust the forces acting on the object to give it ';

function lockAlong(d, s, type){
  if (type === 'opp') return { key: OPP[d], value: rand([2,4,6,8]) };
  return { key: d, value: s + rand([2,4,6]) };
}
function lockSideways(d){
  const keys = axisOf(d)==='x' ? ['N','S'] : ['E','W'];
  return { key: rand(keys), value: rand([2,4,6,8]) };
}
function applyLocks(list){
  for (const L of list){ locked[L.key] = L.value; forces[L.key] = L.value; }
}
function lockNote(){ return Object.keys(locked).length === 1 ? ' The gold force is locked.' : ' The gold forces are locked.'; }

function makeLevel1(i){
  forces = {N:0,S:0,E:0,W:0}; locked = {};
  if (i < 2){
    const ns = rand(['N','S']), ew = rand(['E','W']);
    q = { kind:'dir', dirs:[ns, ew] };
    return `${LEAD}a net force to the ${B((NAMES[ns]+NAMES[ew]).toLowerCase())}.`;
  }
  if (i < 7){
    const d = rand(['N','S','E','W']), size = rand([2,4,6,8]);
    q = { kind:'value', fx:0, fy:0 };
    if (axisOf(d)==='x') q.fx = sign(d)*size; else q.fy = sign(d)*size;
    if (i === 2) applyLocks([lockAlong(d, size, 'opp')]);
    else if (i === 3) applyLocks([lockAlong(d, size, 'same')]);
    else if (i === 4) applyLocks([lockSideways(d)]);
    else applyLocks([lockSideways(d), lockAlong(d, size, i === 5 ? 'opp' : 'same')]);
    return `${LEAD}a net force of ${B(size+' N')} to the ${B(NAMES[d].toLowerCase())}.` + lockNote();
  }
  const ns = rand(['N','S']), ew = rand(['E','W']);
  const sx = rand([2,4,6,8]), sy = rand([2,4,6,8]);
  q = { kind:'value', fx: sign(ew)*sx, fy: sign(ns)*sy };
  const types = [['opp','opp'],['opp','same'],['same','same']][i-7];
  applyLocks([lockAlong(ew, sx, types[0]), lockAlong(ns, sy, types[1])]);
  return `${LEAD}a net force of ${B(sx+' N')} to the ${B(NAMES[ew].toLowerCase())} and ${B(sy+' N')} to the ${B(NAMES[ns].toLowerCase())}.` + lockNote();
}

/* ---------------- Levels 2 and 3: mass and acceleration (5 questions each) ----------------
   Level 2 (one direction)
     1  small whole numbers, no locks         (m 2-3, a 1-2)
     2  a bit larger, no locks                (m 2-4, a 2-3)
     3  decimal acceleration, no locks        (m 2 or 4, a 1.5 or 2.5)
     4  one locked force opposite the target
     5  one locked force sideways to the target
   Level 3 (two directions)
     1  small numbers, no locks               (m 1-2, a 1-3)
     2  a bit larger, no locks                (m 2-3, a 1-3)
     3  one locked force, opposite, on one axis
     4  one locked force on each axis, both opposite
     5  one locked force on each axis, one opposite and one the same way
   Every net force stays at 12 N or less, and every question can be solved.       */
const MASS_COUNT = 5;

function accelText(){
  const parts = [];
  if (q.ax) parts.push(`${B(Math.abs(q.ax).toFixed(1)+' m/s/s')} to the ${B(q.ax>0?'east':'west')}`);
  if (q.ay) parts.push(`${B(Math.abs(q.ay).toFixed(1)+' m/s/s')} to the ${B(q.ay>0?'north':'south')}`);
  if (q.need4)
    return `Add ${B('two east-west')} and ${B('two north-south')} forces to the Force Diagram in order for the ${B(q.m.toFixed(1)+'-kg')} object to have an acceleration of ${parts.join(' and ')}.`;
  return `Adjust the forces acting on the ${B(q.m.toFixed(1)+'-kg')} object to give it an acceleration of ${parts.join(' and ')}.`
    + (Object.keys(locked).length ? lockNote() : '');
}
function pick(ms, as, maxF){
  let m, a;
  do { m = rand(ms); a = rand(as); } while (!Number.isInteger(m*a) || m*a > maxF);
  return [m, a];
}

function makeLevel2(i){
  forces = {N:0,S:0,E:0,W:0}; locked = {};
  const d = rand(['N','S','E','W']);
  let m, a;
  if (i === 0) [m, a] = pick([2,3], [1,2], 6);
  else if (i === 1) [m, a] = pick([2,3,4], [2,3], 12);
  else if (i === 2) [m, a] = pick([2,4], [1.5,2.5], 10);
  else [m, a] = pick([2,3,4], [1,2], 8);
  q = { kind:'accel', m, ax: d==='E'?a:d==='W'?-a:0, ay: d==='N'?a:d==='S'?-a:0 };
  const F = m*a;
  if (i === 3) applyLocks([lockAlong(d, F, 'opp')]);
  if (i === 4) applyLocks([lockSideways(d)]);
  return accelText();
}

function makeLevel3(i){
  forces = {N:0,S:0,E:0,W:0}; locked = {};
  const ns = rand(['N','S']), ew = rand(['E','W']);
  let m, ax, ay;
  const ms = i === 0 ? [1,2] : [2,3], as = i === 0 ? [1,2,3] : [1,2,3];
  do { m = rand(ms); ax = rand(as); ay = rand(as); } while (ax === ay || m*ax > 9 || m*ay > 9);
  q = { kind:'accel', m, ax: sign(ew)*ax, ay: sign(ns)*ay };
  const Fx = m*ax, Fy = m*ay;
  if (i === 2){ rand([0,1]) ? applyLocks([lockAlong(ew, Fx, 'opp')]) : applyLocks([lockAlong(ns, Fy, 'opp')]); }
  if (i === 3) applyLocks([lockAlong(ew, Fx, 'opp'), lockAlong(ns, Fy, 'opp')]);
  if (i === 4){
    const flip = rand([0,1]);
    applyLocks([lockAlong(ew, Fx, flip ? 'same' : 'opp'), lockAlong(ns, Fy, flip ? 'opp' : 'same')]);
  }
  return accelText();
}

/* ---------------- Level 4: four forces, no locks (5 questions) ----------------
   Every question needs a force on all four sides (two east-west and two north-south),
   so the opposing forces have to be pulled out together and their difference found.
     1-3  acceleration in one direction (m 2-4, a 1-4, net force 12 N or less)
     4-5  acceleration in two directions (m 2-3, a 1-3 on each axis, unequal)       */
function makeLevel4(i){
  forces = {N:0,S:0,E:0,W:0}; locked = {};
  let m, ax = 0, ay = 0;
  if (i < 3){
    const d = rand(['N','S','E','W']); let a;
    [m, a] = pick([2,3,4], [1,2,3,4], 12);
    ax = d==='E'?a:d==='W'?-a:0; ay = d==='N'?a:d==='S'?-a:0;
  } else {
    const ns = rand(['N','S']), ew = rand(['E','W']); let x, y;
    do { m = rand([2,3]); x = rand([1,2,3]); y = rand([1,2,3]); } while (x === y);
    ax = sign(ew)*x; ay = sign(ns)*y;
  }
  q = { kind:'accel', m, ax, ay, need4:true };
  return accelText();
}

let seen = new Set(), solved = false, levelDone = false;

// tell Class Live (when the sim is inside a lesson page) that a level is finished
function report(name){ try { if (window.parent !== window) window.parent.postMessage({ classliveEvent: name }, '*'); } catch (_) {} }

function freshText(gen){
  let text;
  for (let t = 0; t < 80; t++){
    text = gen();
    const key = text.replace(/<[^>]+>/g, '');
    if (!seen.has(key)){ seen.add(key); return text; }
  }
  return text;   // ran out of new questions: allow a repeat
}

function makeQuestion(){
  stopAnim();
  walk = null; wrongCount = 0; walkEl.hidden = true; qcol.style.visibility = '';
  solved = false; levelDone = false;
  resetHow();
  document.getElementById('checkBtn').textContent = 'Check Answer';
  let text;
  if (level === 1){
    text = freshText(() => makeLevel1(l1Index));
  } else {
    text = freshText(() => (level === 2 ? makeLevel2 : level === 3 ? makeLevel3 : makeLevel4)(l1Index));
  }
  document.getElementById('progress').textContent = `Question ${l1Index+1} of ${levelCount()}`;
  document.getElementById('question').innerHTML = text;
  setFeedback('');
  draw();
}

function levelCount(){ return level === 1 ? L1_COUNT : MASS_COUNT; }

function nextQuestion(){
  l1Index = (l1Index + 1) % levelCount();
  if (l1Index === 0) seen = new Set();
  makeQuestion();
}

function setFeedback(t, ok){
  const f = document.getElementById('feedback');
  f.textContent = t;
  f.style.color = ok === undefined ? '' : ok ? 'var(--aero-emerald)' : 'var(--aero-gold)';
  wrongShown = (ok === false);
}
function setLevel(n){
  level = n;
  document.querySelectorAll('.levelrow button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.level === n));
  l1Index = 0;
  seen = new Set();
  makeQuestion();
}

function check(){
  if (walk){ walkCheck(); return; }
  if (solved){
    if (levelDone && level < 4) setLevel(level + 1);   // finished a level: go on to the next one
    else nextQuestion();
    return;
  }
  const fx = forces.E - forces.W, fy = forces.N - forces.S;
  let ok;
  if (q.kind === 'dir'){
    const want = { x:0, y:0 };
    for (const d of q.dirs) want[axisOf(d)] = sign(d);
    ok = Math.sign(fx) === want.x && Math.sign(fy) === want.y;
  } else if (q.kind === 'value'){
    ok = fx === q.fx && fy === q.fy;
  } else {
    ok = fx === q.m*q.ax && fy === q.m*q.ay;
  }
  if (!ok && level === 1 && q.kind === 'value' && Object.keys(locked).length){
    wrongCount++;
    if (wrongCount >= 2){ setFeedback(''); startWalk(); return; }   // second wrong Check: walk through the math
  }
  if (ok && q.need4 && !(forces.N > 0 && forces.S > 0 && forces.E > 0 && forces.W > 0)){
    setFeedback('The net force is right, but use two east-west and two north-south forces.', false);
    return;
  }
  levelDone = ok && l1Index === levelCount() - 1;
  setFeedback(!ok ? 'Not quite. Try again.' : levelDone ? `Correct. You finished Level ${level}.` : 'Correct.', ok);
  if (ok){
    solved = true;
    startAnim(fx, fy);
    if (levelDone) report(`level${level}Done`);
    document.getElementById('checkBtn').textContent = !levelDone ? 'Next Question' : level < 4 ? `Go to Level ${level + 1}` : 'Start Level 4 Again';
  }
}

function resize(){
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layout();
  draw();
}

// Keep the question box clear of every place an arrow can be pulled:
// the box stays left of the north arrow, and the object sits low enough that the west arrow passes under the box.
const qcol = document.querySelector('.leftcol'), qtext = document.getElementById('question');
function layout(){
  cx = W/2;
  qcol.style.width = Math.max(260, Math.min(600, cx - 130)) / UI_K + 'px';
  for (let fs = 22; fs >= 16; fs--){            // largest size (22 to 16 px) that fits in three lines
    qtext.style.fontSize = fs + 'px';
    if (qtext.scrollHeight <= fs * 1.35 * 3 + 2) break;
  }
  const titleW = document.querySelector('.titlebox').offsetWidth * UI_K;
  walkEl.style.width = Math.max(300, W - 48 - titleW - 16) / UI_K + 'px';   // across the top, left of the title
  const bottom = Math.max(qcol.offsetTop + qcol.offsetHeight * UI_K,
                          walkEl.hidden ? 0 : walkEl.offsetTop + walkEl.offsetHeight * UI_K);
  cy = Math.max(H/2, bottom + 24);
  const room = Math.min(cy - RO - 44, H - cy - RO - 44, cx - RO - 210);   // up, down, and sideways with the label
  scale = Math.max(3, room / MAXF);
}
const walkEl = document.getElementById('walk');
const ro = new ResizeObserver(() => { layout(); draw(); }); ro.observe(qcol); ro.observe(walkEl);

const UI_K = 0.75;                   // everything but the object is 25% smaller
const RO = 32, HEAD = 30*UI_K, DOT = 8*UI_K;   // object radius, arrowhead length, drag-dot radius

function dotPos(k){ const [dx,dy] = DIRS[k], L = RO + forces[k]*scale; return [cx+dx*L, cy+dy*L]; }

/* ---------------- animation after a correct answer ----------------
   The object (with its arrows) speeds up from rest along the net force and runs off the field.
   A bigger net force means a bigger acceleration. Mass is not used here. */
let ox = 0, oy = 0, animId = 0;
const SLOW = 0.5;                  // the motion plays at half speed
function stopAnim(){ if (animId) cancelAnimationFrame(animId); animId = 0; ox = 0; oy = 0; }
function startAnim(fx, fy){
  stopAnim();
  const mag = Math.hypot(fx, fy); if (!mag) return;
  const ux = fx/mag, uy = -fy/mag;               // screen y points down, north is up
  const acc = 60 + 25*mag;                        // pixels per second per second
  const t0 = performance.now();
  (function step(now){
    const real = (now - t0)/1000, t = real*SLOW, d = 0.5*acc*t*t;
    ox = ux*d; oy = uy*d;
    draw();
    const gone = cx+ox < -250 || cx+ox > W+250 || cy+oy < -250 || cy+oy > H+250;
    animId = (gone || real > 14) ? 0 : requestAnimationFrame(step);
  })(t0);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(ox, oy);
  drawScene();
  ctx.restore();
  if (walk) walkLive();
  howLive();
}

function drawScene(){
  // object
  ctx.beginPath(); ctx.arc(cx,cy,RO,0,Math.PI*2);
  ctx.fillStyle = '#D2CBBD'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#000000'; ctx.stroke();
  if (q && q.m){
    ctx.fillStyle = '#12291F'; ctx.font = '18px Helvetica, Arial, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(q.m.toFixed(1), cx, cy - 9);   // two lines so it fits inside the object
    ctx.fillText('kg', cx, cy + 10);
  }
  for (const k of ['N','S','E','W']){
    const [dx,dy] = DIRS[k], [px,py] = dotPos(k), f = forces[k];
    const isLocked = k in locked;
    const col = isLocked ? LOCKED_COLOR : '#E8EEEA';
    if (f > 0){
      // arrow runs from the object's edge to the dot; the dot sits on the arrow's point
      const hl = Math.min(HEAD, Math.max(8, f*scale)), hw = Math.min(14*UI_K, hl*0.6);
      const bx = px-dx*hl, by = py-dy*hl;                    // base of the head
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 5*UI_K;
      if (f*scale > hl){ ctx.beginPath(); ctx.moveTo(cx+dx*RO, cy+dy*RO); ctx.lineTo(bx, by); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(bx-dy*hw, by+dx*hw); ctx.lineTo(bx+dy*hw, by-dx*hw); ctx.closePath(); ctx.fill();
      ctx.font = (18*UI_K)+'px Helvetica, Arial, sans-serif';
      const txt = `${f} N ${NAMES[k]}${isLocked ? ' (locked)' : ''}`, gap = DOT+8;
      if (k==='N'){ ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(txt, px, py-gap); }
      if (k==='S'){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(txt, px, py+gap); }
      if (k==='E'){ ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(txt, px+gap, py); }
      if (k==='W'){ ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(txt, px-gap, py); }
    }
    if (!isLocked){
      ctx.beginPath(); ctx.arc(px, py, drag===k ? DOT+2 : DOT, 0, Math.PI*2);
      ctx.fillStyle = '#A31F1F'; ctx.fill();
      ctx.lineWidth = 2.5*UI_K; ctx.strokeStyle = '#000000'; ctx.stroke();
    }
  }
}


/* ---------------- walkthrough after the second wrong Check (Level 1, locked forces) ----------------
   Per wrong axis: add the forces with signs, pick the direction, write the net force (each with a reveal),
   then ask what force is needed for the target; if that fails, drag the force and do the math. */
let walk = null, wrongCount = 0;
const AX = {
  x:{ pos:'E', neg:'W', posN:'east',  negN:'west'  },
  y:{ pos:'N', neg:'S', posN:'north', negN:'south' }
};
const sg = n => n > 0 ? '+' + n : n < 0 ? '−' + (-n) : '0';
function parseNum(v){
  v = String(v).replace(/[−–—]/g,'-').replace(/\s+/g,'');
  return /^[+-]?\d+(\.\d+)?$/.test(v) ? Number(v) : NaN;
}
const dirOf = (ax, n) => n > 0 ? AX[ax].posN : AX[ax].negN;
const netDesc = (ax, T) => T === 0 ? '0 N' : `${Math.abs(T)} N to the ${dirOf(ax, T)}`;
const axisNet = ax => forces[AX[ax].pos] - forces[AX[ax].neg];
const wkMsg = t => { const m = document.getElementById('wkMsg'); if (m) m.textContent = t; };
function wkBtn(t){ document.getElementById('checkBtn').textContent = t; }

function startWalk(){
  const tasks = [];
  for (const ax of ['x','y']){
    const T = ax === 'x' ? q.fx : q.fy;
    if (axisNet(ax) !== T) tasks.push({ ax, T });
  }
  walk = { tasks, ti:-1, steps:[], si:0, done:[], tries:0, revealed:false, endAfter:false, dragOK:false };
  qcol.style.visibility = 'hidden';
  walkEl.hidden = false;
  nextTask();
}

function nextTask(){
  walk.ti++;
  if (walk.ti >= walk.tasks.length){ endWalk(); return; }
  const { ax, T } = walk.tasks[walk.ti], a = AX[ax];
  const P = forces[a.pos], Nn = forces[a.neg], net = P - Nn;
  const steps = [];
  steps.push({ type:'sum', terms:[P, -Nn, net], blank:[1,1,1], tries:2, fail:'reveal',
    intro:`Treat the force pointing ${a.negN} as negative and the force pointing ${a.posN} as positive.`,
    ask:`Add the ${a.posN} and ${a.negN} forces:` });
  if (net !== 0){
    steps.push({ type:'dir', ax, value:net, what:'net force' });
    steps.push({ type:'write', ax, value:net, what:'net force' });
  }
  const kL = a.pos in locked ? a.pos : a.neg in locked ? a.neg : null;
  if (kL){
    const Ls = kL === a.pos ? locked[kL] : -locked[kL];
    const sF = T - Ls, kF = kL === a.pos ? a.neg : a.pos;
    steps.push({ type:'sum', terms:[Ls, sF, T], blank:[0,1,0], tries:2, fail:'drag', ax, kF, T, sF,
      intro:`What force would you need to add to give the object a net force of ${netDesc(ax, T)}?`,
      ask:'Fill in the missing force:' });
    if (sF !== 0){
      steps.push({ type:'dir', ax, value:sF, what:'force' });
      steps.push({ type:'write', ax, value:sF, what:'force' });
    }
  }
  walk.steps = steps; walk.si = 0; walk.done = [];
  renderWalk();
}

function renderWalk(){
  const s = walk.steps[walk.si], a = AX[s.ax || 'x'];
  walk.tries = s.tries || 1; walk.revealed = false; walk.dragOK = (s.type === 'drag'); s.choice = null;
  let h = '';
  for (const l of walk.done.slice(-2)) h += `<p class="wdone">${l}</p>`;
  if (s.intro) h += `<p>${s.intro}</p>`;
  if (s.type === 'sum'){
    const t = i => s.blank[i] ? `<input id="wk${i}" autocomplete="off">` : sg(s.terms[i]);
    h += `<p>${s.ask}</p><div class="eq32">${t(0)} + ${t(1)} = ${t(2)}</div>`;
  } else if (s.type === 'dir'){
    const A = AX[s.ax];
    h += `<p>A ${s.what} of ${sg(s.value)} N points:</p><div><button data-d="pos">${A.posN[0].toUpperCase()+A.posN.slice(1)}</button>` +
         `<button data-d="neg">${A.negN[0].toUpperCase()+A.negN.slice(1)}</button></div>`;
  } else if (s.type === 'write'){
    h += `<div class="eq32">Write the ${s.what}: <input id="wkn" autocomplete="off"> N <input class="dirtxt" id="wkd" autocomplete="off"></div>`;
  } else if (s.type === 'drag'){
    h += `<p>Drag the ${NAMES[s.kF].toLowerCase()} force until the net force is ${netDesc(s.ax, s.T)}.</p><div class="eq32" id="wkLive"></div>`;
  }
  h += '<div class="hmsg" id="wkMsg"></div>';
  walkEl.innerHTML = h;
  wkBtn('Check Answer');
  const first = walkEl.querySelector('input'); if (first) first.focus();
  layout(); draw();
}

walkEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if (!b || !walk || walk.revealed) return;
  walk.steps[walk.si].choice = b.dataset.d;
  walkEl.querySelectorAll('button[data-d]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
walkEl.addEventListener('keydown', e => { if (e.key === 'Enter' && walk) check(); });

function walkLive(){
  const el = document.getElementById('wkLive'), s = walk && walk.steps[walk.si];
  if (!el || !s || !s.ax) return;
  const n = axisNet(s.ax);
  el.textContent = `Net force: ${sg(n)} N` + (n ? ` (${dirOf(s.ax, n)})` : '');
}

function finishStep(){
  const s = walk.steps[walk.si];
  if (s.type === 'sum') walk.done.push(`${sg(s.terms[0])} + ${sg(s.terms[1])} = ${sg(s.terms[2])}`);
  if (s.type === 'dir') walk.done.push(`${sg(s.value)} N points ${dirOf(s.ax, s.value)}.`);
  if (s.type === 'write') walk.done.push(`The ${s.what} is ${Math.abs(s.value)} N ${dirOf(s.ax, s.value)}.`);
  if (walk.endAfter){ endWalk(); nextQuestion(); return; }
  walk.si++;
  if (walk.si >= walk.steps.length) nextTask(); else renderWalk();
}

function reveal(s, text){
  walk.revealed = true;
  if (s.type === 'sum') s.blank.forEach((b,i) => { if (b){ const f = document.getElementById('wk'+i); f.value = sg(s.terms[i]); f.readOnly = true; } });
  if (s.type === 'write'){
    const n = document.getElementById('wkn'), d = document.getElementById('wkd');
    n.value = Math.abs(s.value); d.value = dirOf(s.ax, s.value); n.readOnly = d.readOnly = true;
  }
  if (s.type === 'dir'){
    walkEl.querySelectorAll('button[data-d]').forEach(x => x.setAttribute('aria-pressed', x.dataset.d === (s.value > 0 ? 'pos' : 'neg')));
  }
  wkMsg(text + ' Press Continue.');
  wkBtn('Continue');
}

function walkCheck(){
  const s = walk.steps[walk.si];
  if (walk.revealed){ finishStep(); return; }
  if (s.type === 'sum'){
    const ok = s.blank.every((b,i) => !b || parseNum(document.getElementById('wk'+i).value) === s.terms[i]);
    if (ok){ finishStep(); return; }
    if (--walk.tries > 0){ wkMsg('Not quite. Check the signs and try again.'); return; }
    if (s.fail === 'drag'){
      walk.steps.splice(walk.si + 1);
      walk.steps.push({ type:'drag', ax:s.ax, kF:s.kF, T:s.T, need:Math.abs(s.sF), tries:2 });
      walk.si++; renderWalk(); return;
    }
    if (s.fail === 'end') walk.endAfter = true;
    reveal(s, 'Here is the answer.'); return;
  }
  if (s.type === 'dir'){
    if (!s.choice){ wkMsg('Pick a direction.'); return; }
    if (s.choice === (s.value > 0 ? 'pos' : 'neg')){ finishStep(); return; }
    reveal(s, `A ${sg(s.value)} N ${s.what} points ${dirOf(s.ax, s.value)}.`); return;
  }
  if (s.type === 'write'){
    const n = parseNum(document.getElementById('wkn').value), d = document.getElementById('wkd').value.trim().toLowerCase();
    const want = dirOf(s.ax, s.value);
    if (n === Math.abs(s.value) && (d === want || d === want[0])){ finishStep(); return; }
    reveal(s, `The ${s.what} is ${Math.abs(s.value)} N ${want}.`); return;
  }
  if (s.type === 'drag'){
    if (axisNet(s.ax) === s.T){
      walk.dragOK = false;
      const a = AX[s.ax], P = forces[a.pos], Nn = forces[a.neg];
      walk.done.push(`Net force: ${sg(P - Nn)} N`);
      walk.steps.push({ type:'sum', terms:[P, -Nn, P - Nn], blank:[1,1,1], tries:2, fail:'end',
        intro:'Now go through the math.', ask:'Add the two forces:', ax:s.ax });
      walk.si++; renderWalk(); return;
    }
    if (--walk.tries > 0){ wkMsg('Not quite. Keep adjusting.'); return; }
    forces[s.kF] = s.need; walk.dragOK = false; walk.endAfter = true; draw();
    reveal(s, `The ${NAMES[s.kF].toLowerCase()} force needs to be ${s.need} N.`);
  }
}

function endWalk(){
  walk = null; wrongCount = 0;
  walkEl.hidden = true; qcol.style.visibility = '';
  wkBtn('Check Answer');
  setFeedback(''); layout(); draw();
}

/* ---------------- dragging the dots ---------------- */
function cpos(e){ const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
function hitDot(x, y){
  let best = null, bd = 30;
  for (const k in DIRS){
    if (k in locked) continue;
    const [px,py] = dotPos(k), d = Math.hypot(x-px, y-py);
    if (d < bd){ bd = d; best = k; }
  }
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (solved || (walk && !walk.dragOK)) return;
  const [x,y] = cpos(e), k = hitDot(x,y);
  if (!k) return;
  drag = k;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  cv.style.cursor = 'grabbing';
  draw();
});
cv.addEventListener('pointermove', e => {
  const [x,y] = cpos(e);
  if (drag){
    const [dx,dy] = DIRS[drag];
    const along = (x-cx)*dx + (y-cy)*dy - RO;
    const f = Math.max(0, Math.min(MAXF, Math.round(along/scale)));
    if (f !== forces[drag]){ forces[drag] = f; setFeedback(''); }
    draw();
  } else {
    cv.style.cursor = (!solved && !(walk && !walk.dragOK) && hitDot(x,y)) ? 'grab' : 'default';
  }
});
function endDrag(){ drag = null; cv.style.cursor = 'default'; draw(); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---------------- Level 2 "Show me how" ---------------- */
const FN = 'F<sub>net</sub>';
const howBox = document.getElementById('howbox'), howBtn = document.getElementById('howBtn');
let how = null;

function isEquation(t){
  const n = t.toLowerCase().replace(/[\s·⋅×*._()σ∑x]/g, '').replace(/net/g, '');
  return ['f=ma', 'f=am', 'ma=f', 'am=f'].includes(n);
}
function numIs(str, target){
  const v = parseFloat(String(str).replace(',', '.'));
  return isFinite(v) && Math.abs(v - target) < 0.05;
}
function howVals(){
  const cur = howAxes()[how.ai || 0];
  return { m:q.m, a:cur.a, F:q.m*cur.a, dir:cur.dir };
}
function resetHow(){
  how = null; howBox.hidden = true; howBox.innerHTML = '';
  howBtn.hidden = false; howBtn.textContent = 'Show me how';
}
howBtn.onclick = () => {
  if (walk || solved) return;
  if (!howBox.hidden){ resetHow(); return; }
  if (level === 1 && q.kind === 'value'){
    // Level 1 questions with locked forces: run the step-by-step walkthrough from a clean start
    for (const k of ['N','S','E','W']) if (!(k in locked)) forces[k] = 0;
    setFeedback(''); startWalk(); return;
  }
  how = (level === 1) ? { mode:'dir', i:0, msg:'' } : { step:'eq1', msg:'', ai:0, res:[] };
  howBox.hidden = false; howBtn.textContent = 'Hide help';
  // Level 4: if the arrows already give the right net force, skip the F = ma steps
  if (level === 4 && forces.E - forces.W === q.m*q.ax && forces.N - forces.S === q.m*q.ay){
    how.res = howAxes().map(x => `${FN} = (${q.m.toFixed(1)} kg)(${x.a.toFixed(1)} m/s/s) = ${q.m*x.a} N ${x.dir}`);
    how.step = 'done'; how.skipped = true;
  }
  if (level === 1) renderHowDir(); else renderHow();
};
const keyOf = n => n[0].toUpperCase();
function howPairs(){
  const out = howAxes().map(x => ({ small:OPPN[x.dir], big:x.dir, F:q.m*x.a }));
  if (!q.ax) out.push({ small:'west', big:'east', F:0 });
  if (!q.ay) out.push({ small:'south', big:'north', F:0 });
  return out;
}
function howLive(){
  const el = document.getElementById('hLive');
  if (!el || !how || how.step !== 'drag') return;
  const P = how.pairs[how.pi], n = forces[keyOf(P.big)] - forces[keyOf(P.small)];
  el.textContent = `Net force: ${n ? Math.abs(n) + ' N ' + (n > 0 ? P.big : P.small) : '0 N'}`;
}
const OPPN = { east:'west', west:'east', north:'south', south:'north' };
function howAxes(){
  const out = [];
  if (q.ax) out.push({ a:Math.abs(q.ax), dir:q.ax > 0 ? 'east' : 'west' });
  if (q.ay) out.push({ a:Math.abs(q.ay), dir:q.ay > 0 ? 'north' : 'south' });
  return out;
}
// Level 1, "net force to the northeast" type questions
function renderHowDir(){
  const [ns, ew] = q.dirs, lc = d => NAMES[d].toLowerCase();
  const msg = `<div class="hmsg" id="hMsg">${how.msg || ''}</div>`;
  let h;
  if (how.i >= 2){
    h = `<p>Make the ${lc(ns)} force bigger than the ${lc(OPP[ns])} force, and the ${lc(ew)} force bigger than the ${lc(OPP[ew])} force.</p>`;
  } else {
    const d = q.dirs[how.i];
    const intro = how.i === 0 ? `<p>A net force to the ${B(lc(ns)+lc(ew))} has two parts: a net force to the ${B(lc(ns))} and a net force to the ${B(lc(ew))}.</p>` : '';
    h = intro + `<p>To get a net force to the ${B(lc(d))}, the ${lc(d)} force must be:</p><div class="hrow"><button data-c="bigger">bigger than the ${lc(OPP[d])} force</button><button data-c="smaller">smaller than the ${lc(OPP[d])} force</button><button data-c="equal">equal to the ${lc(OPP[d])} force</button></div>` + msg;
  }
  howBox.innerHTML = h;
  howBox.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => {
    if (b.dataset.c === 'bigger'){ how.i++; how.msg = ''; } else how.msg = 'Not quite. Think about which force would win.';
    renderHowDir();
  });
}

function renderHow(){
  if (how.mode === 'dir'){ renderHowDir(); return; }
  const v = howVals(), s = how.step, prev = how.res.map(r => `<p>${r}</p>`).join(''), multi = howAxes().length > 1,
    intro = !multi ? '' : how.ai === 0 ? `<p>The acceleration points two ways, so find the net force for each. Start with ${B(v.dir)}.</p>` : `<p>Now the ${B(v.dir)} direction.</p>`,
    msg = `<div class="hmsg" id="hMsg">${how.msg || ''}</div>`;
  let h = '';
  if (s === 'eq1' || s === 'eq2'){
    h = `<p>${s === 'eq1' ? 'What equation do you need to solve this?' : 'What equation relates acceleration, mass and force?'}</p>
      <div class="hrow"><input id="hIn" type="text" autocomplete="off" aria-label="Equation"><button class="primary" id="hGo">Check</button></div>${msg}`;
  } else if (s === 'reveal'){
    h = `<p>The equation is <b>${FN} = ma</b>.</p><div class="hrow"><button class="primary" id="hGo">Continue</button></div>`;
  } else if (s === 'click'){
    h = `<div class="eq32"><button class="tok" data-v="F">${FN}</button> = <button class="tok" data-v="m">m</button><button class="tok" data-v="a">a</button></div>
      <p>Click on what you are trying to find.</p>${msg}`;
  } else if (s === 'fill'){
    h = prev + intro + `<div class="eq32">${FN} = ?</div><p>Fill in the mass and the acceleration.</p>
      <div class="hrow"><label>m = <input id="hM" class="num" inputmode="decimal" autocomplete="off"> kg</label>
      <label>a = <input id="hA" class="num" inputmode="decimal" autocomplete="off"> m/s/s</label></div>
      <div class="hrow"><button class="primary" id="hGo">Check</button></div>${msg}`;
  } else if (s === 'solve'){
    h = prev + `<div class="eq32">${FN} = ma</div><div class="eq32">${FN} = (${v.m.toFixed(1)} kg)(${v.a.toFixed(1)} m/s/s)</div><p>Solve for ${FN}.</p>
      <div class="hrow"><label>${FN} = <input id="hF" class="num" inputmode="decimal" autocomplete="off"> N</label><button class="primary" id="hGo">Check</button></div>${msg}`;
  } else if (s === 'pair'){
    const P = how.pairs[how.pi], Cap = t => t[0].toUpperCase() + t.slice(1);
    const axName = (P.big === 'east' || P.big === 'west') ? 'east-west' : 'north-south';
    const part = t => `<div class="hpart">${t}</div>`;
    h = (how.res.length ? part(how.res.map(r => `<p>${r}</p>`).join('')) : '') +
      part(`<p>Each side needs <b>at least</b> 1 N of force.</p>`) +
      part(P.F
      ? `<p>The ${axName} forces must differ by ${B(P.F + ' N')}.</p><p>Pick a ${P.small} force, then add ${P.F} N to get the ${P.big} force.</p>`
      : `<p>The net force on the ${axName} axis is 0 N, so the two forces must be ${B('equal')}.</p><p>Pick a force for both.</p>`) +
      `<div class="hpart"><div class="hrow"><label>${Cap(P.small)} = <input id="pS" class="num" inputmode="numeric" autocomplete="off"> N</label>
       <label>${Cap(P.big)} = <input id="pB" class="num" inputmode="numeric" autocomplete="off"> N</label><button class="primary" id="hGo">Check</button></div>${msg}</div>`;
  } else if (s === 'drag'){
    const P = how.pairs[how.pi];
    h = `<p>Drag the ${B(P.small)} arrow to ${B(P.sv + ' N')} and the ${B(P.big)} arrow to ${B(P.bv + ' N')}.</p><div class="eq32" id="hLive"></div>
      <div class="hrow"><button class="primary" id="hGo">Continue</button></div>${msg}`;
  } else if (s === 'final'){
    h = `<p>All four forces are at least 1 N and the net force is right. Press ${B('Check Answer')}.</p>`;
  } else {
    const axs = howAxes();
    h = how.skipped ? '' : how.res.map(r => `<div class="eq32">${r}</div>`).join('') +
      `<p>Now adjust the forces acting on the object to give it a net force of ${axs.map(x => `${B(q.m*x.a + ' N')} to the ${B(x.dir)}`).join(' and ')}.</p>`;
    if (how.skipped) h = '';
    else if (Object.keys(locked).length) h += `<p>The gold forces are locked, so work out what the other forces must be.</p>`;
    if (level === 4){
      const big = x => `the force to the ${x.dir} must be ${B(q.m*x.a + ' N')} bigger than the ${OPPN[x.dir]} force`;
      const pullPair = x => `one ${x.dir} force and one ${OPPN[x.dir]} force`;
      h += `<p>Each axis needs one force in each direction.</p>`;
      if (axs.length === 1){
        const x = axs[0], other = (x.dir === 'east' || x.dir === 'west') ? { dir:'north' } : { dir:'east' };
        h += `<p>In other words, you must pull out ${pullPair(x)}.</p>
          <p>In this example, ${big(x)}.</p>
          <p>You must also pull out ${pullPair(other)} which add up to 0 N.</p>`;
      } else {
        h += `<p>In other words, you must pull out ${pullPair(axs[0])}, and ${pullPair(axs[1])}.</p>
          <p>In this example, ${big(axs[0])}.</p>
          <p>Also, ${big(axs[1])}.</p>`;
      }
      if (!how.skipped) h += `<div class="hrow"><button class="primary" id="hGo">Help me pick the forces</button></div>`;
    }
  }
  howBox.innerHTML = h;
  howBox.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); howGo(); }
  }));
  const go = howBox.querySelector('#hGo'); if (go) go.onclick = howGo;
  howBox.querySelectorAll('.tok').forEach(b => b.onclick = () => howTok(b.dataset.v));
  const first = howBox.querySelector('input'); if (first) first.focus();
  howLive();
}
function howSet(step, msg){ how.step = step; how.msg = msg || ''; renderHow(); }
function howMsg(t){ const m = document.getElementById('hMsg'); if (m) m.textContent = t; }
function howVal(id){ const e = howBox.querySelector(id); return e ? e.value : ''; }

function howGo(){
  const v = howVals(), s = how.step;
  if (s === 'eq1'){ if (isEquation(howVal('#hIn'))) howSet('click'); else howSet('eq2', 'Not quite.'); }
  else if (s === 'eq2'){ if (isEquation(howVal('#hIn'))) howSet('click'); else howSet('reveal'); }
  else if (s === 'reveal'){ howSet('click'); }
  else if (s === 'fill'){
    if (!numIs(howVal('#hM'), v.m)) howMsg('Check the mass in the question.');
    else if (!numIs(howVal('#hA'), v.a)) howMsg('Check the acceleration in the question.');
    else howSet('solve');
  }
  else if (s === 'done' && level === 4){ how.pairs = howPairs(); how.pi = 0; howSet('pair'); }
  else if (s === 'pair'){
    const P = how.pairs[how.pi], lim = MAXF - P.F;
    const sv = parseNum(howVal('#pS')), bv = parseNum(howVal('#pB'));
    if (!Number.isInteger(sv) || sv < 1 || sv > lim) howMsg(`Pick a whole number of newtons from 1 to ${lim} for the ${P.small} force.`);
    else if (bv !== sv + P.F) howMsg(P.F ? `Not quite. ${P.F} N more than ${sv} N is ${sv + P.F} N.` : 'Not quite. The two forces must be equal.');
    else { P.sv = sv; P.bv = bv; howSet('drag'); }
  }
  else if (s === 'drag'){
    const P = how.pairs[how.pi];
    if (forces[keyOf(P.small)] !== P.sv) howMsg(`Drag the ${P.small} arrow to ${P.sv} N.`);
    else if (forces[keyOf(P.big)] !== P.bv) howMsg(`Drag the ${P.big} arrow to ${P.bv} N.`);
    else if (++how.pi < how.pairs.length) howSet('pair');
    else howSet('final');
  }
  else if (s === 'solve'){
    if (numIs(howVal('#hF'), v.F)){
      how.res.push(`${FN} = (${v.m.toFixed(1)} kg)(${v.a.toFixed(1)} m/s/s) = ${v.F} N ${v.dir}`);
      if (how.ai < howAxes().length - 1){ how.ai++; howSet('fill'); } else howSet('done');
    }
    else howMsg('Not quite. Multiply the mass by the acceleration.');
  }
}
function howTok(t){
  if (t === 'F') howSet('fill');
  else howMsg('The question gives you the mass and the acceleration. What is missing?');
}

document.getElementById('checkBtn').onclick = check;
// "Not quite" closes when the student clicks anywhere
let wrongShown = false;
document.addEventListener('pointerdown', () => { if (wrongShown) setFeedback(''); }, true);
document.querySelectorAll('.levelrow button').forEach(b => b.onclick = () => setLevel(+b.dataset.level));
window.addEventListener('resize', resize);
makeQuestion(); resize();
